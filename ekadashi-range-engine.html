<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ekādaśī Range Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/swisseph-wasm@1.0.4/dist/swisseph.js"></script>
<style>
:root {
  --ink:     #0e0c0a;
  --paper:   #f5f0e8;
  --saffron: #c8601a;
  --gold:    #b8960c;
  --tulsi:   #2d5a1b;
  --cream:   #ede8da;
  --muted:   #7a7060;
  --border:  #d4ccb8;
  --warn:    #8b4500;
  --red:     #8b1a1a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Cormorant Garamond', Georgia, serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none; z-index: 1000; opacity: 0.5;
}
.top-rule {
  height: 3px;
  background: linear-gradient(90deg, transparent, var(--saffron) 20%, var(--gold) 50%, var(--saffron) 80%, transparent);
}
header {
  text-align: center;
  padding: 2.5rem 1rem 1.5rem;
  border-bottom: 1px solid var(--border);
}
.header-om { font-size: 2rem; color: var(--saffron); opacity: 0.6; line-height: 1; margin-bottom: 0.4rem; letter-spacing: 0.2em; }
header h1 { font-size: clamp(1.8rem, 5vw, 2.8rem); font-weight: 300; letter-spacing: 0.12em; color: var(--ink); line-height: 1.1; }
header h1 span { color: var(--saffron); font-style: italic; }
.header-sub { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--muted); letter-spacing: 0.25em; text-transform: uppercase; margin-top: 0.6rem; }
.engine-badges { display: flex; justify-content: center; gap: 0.6rem; margin-top: 1rem; flex-wrap: wrap; }
.badge { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; letter-spacing: 0.15em; padding: 0.25rem 0.7rem; border: 1px solid currentColor; border-radius: 2px; text-transform: uppercase; }
.badge-se   { color: var(--tulsi);   border-color: var(--tulsi); }
.badge-isk  { color: var(--gold);    border-color: var(--gold); }

main { max-width: 860px; margin: 0 auto; padding: 2rem 1.2rem 4rem; }

.card {
  background: var(--cream);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 1.4rem 1.6rem;
  margin-bottom: 1.4rem;
}
.card-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.62rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 1rem;
  display: flex; align-items: center; gap: 0.5rem;
}
.card-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

.input-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.8rem;
  margin-bottom: 0.8rem;
}
@media (max-width: 500px) { .input-grid { grid-template-columns: 1fr; } }

.loc-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 0.8rem; align-items: end; margin-bottom: 0.8rem; }
@media (max-width: 500px) { .loc-row { grid-template-columns: 1fr 1fr; } .loc-row .gps-btn { grid-column: 1/-1; } }

.field label {
  display: block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.58rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 0.35rem;
}
.field input {
  width: 100%;
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 0.55rem 0.7rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.85rem;
  color: var(--ink);
  outline: none;
  transition: border-color 0.2s;
}
.field input:focus { border-color: var(--saffron); }

.gps-btn, .calc-btn {
  border: none; border-radius: 2px; cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.65rem; letter-spacing: 0.15em;
  text-transform: uppercase; transition: all 0.2s; white-space: nowrap;
}
.gps-btn { background: var(--ink); color: var(--paper); padding: 0.55rem 1rem; }
.gps-btn:hover { background: var(--saffron); }
.gps-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.calc-btn {
  background: var(--saffron); color: white;
  padding: 0.65rem 2rem; font-size: 0.72rem;
  width: 100%; margin-top: 0.4rem;
}
.calc-btn:hover:not(:disabled) { background: var(--ink); }
.calc-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.se-status {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.6rem; letter-spacing: 0.15em;
  text-align: center; padding: 0.4rem;
  color: var(--muted); margin-bottom: 1rem;
}
.se-status.ready  { color: var(--tulsi); }
.se-status.loading { color: var(--warn); }

.progress-bar-wrap {
  background: var(--border); border-radius: 2px; height: 4px;
  margin-bottom: 1rem; overflow: hidden; display: none;
}
.progress-bar-wrap.visible { display: block; }
.progress-bar { height: 100%; background: var(--saffron); transition: width 0.3s; border-radius: 2px; }

/* ── Results list ── */
#results-container { display: none; }
#results-container.visible { display: block; }

.results-header {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.62rem; letter-spacing: 0.25em;
  text-transform: uppercase; color: var(--muted);
  margin-bottom: 1rem;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem;
}
.results-count {
  background: var(--saffron); color: white;
  padding: 0.15rem 0.6rem; border-radius: 2px;
  font-size: 0.6rem;
}

/* Each Ekadashi card */
.ek-card {
  background: var(--cream);
  border: 1px solid var(--border);
  border-radius: 2px;
  margin-bottom: 1.2rem;
  overflow: hidden;
  animation: fadeIn 0.3s ease forwards;
  opacity: 0;
}
@keyframes fadeIn { to { opacity: 1; } }

.ek-card-header {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 1rem 1.4rem;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(135deg, rgba(200,96,26,0.05) 0%, transparent 60%);
  flex-wrap: wrap;
}
.ek-serial {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.65rem; color: var(--muted);
  min-width: 2rem;
}
.ek-paksha-dot {
  width: 8px; height: 8px; border-radius: 50%;
  flex-shrink: 0;
}
.dot-shukla { background: var(--gold); }
.dot-krishna { background: var(--muted); }
.ek-name-block { flex: 1; }
.ek-name-en { font-size: 1.25rem; font-weight: 400; letter-spacing: 0.04em; line-height: 1.2; }
.ek-name-bn { font-size: 0.9rem; color: var(--muted); font-style: italic; }
.ek-paksha-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.58rem; letter-spacing: 0.15em;
  text-transform: uppercase; padding: 0.2rem 0.6rem;
  border-radius: 2px; border: 1px solid currentColor;
}
.tag-shukla { color: var(--gold); border-color: var(--gold); }
.tag-krishna { color: var(--muted); border-color: var(--muted); }
.mahadvadashi-tag {
  font-family: 'JetBrains Mono', monospace; font-size: 0.58rem;
  letter-spacing: 0.12em; text-transform: uppercase;
  background: var(--saffron); color: white;
  padding: 0.2rem 0.6rem; border-radius: 2px;
}

.ek-card-body {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 0;
}
@media (max-width: 600px) { .ek-card-body { grid-template-columns: 1fr; } }

.ek-section {
  padding: 1rem 1.4rem;
  border-right: 1px solid var(--border);
}
.ek-section:last-child { border-right: none; }
@media (max-width: 600px) {
  .ek-section { border-right: none; border-bottom: 1px solid var(--border); }
  .ek-section:last-child { border-bottom: none; }
}

.ek-section-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.55rem; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--muted);
  margin-bottom: 0.6rem;
}

.ek-fast-date {
  font-size: 1rem; font-weight: 400;
  letter-spacing: 0.02em; line-height: 1.3;
  color: var(--ink);
}
.ek-fast-day {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem; color: var(--saffron); margin-top: 0.2rem;
}

/* Tithi window */
.ek-tithi-row {
  display: flex; align-items: center; gap: 0.5rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem; color: var(--ink);
  margin-bottom: 0.3rem;
}
.tithi-label { color: var(--muted); font-size: 0.62rem; min-width: 2.5rem; }
.tithi-time { font-weight: 500; }
.tithi-date-sub { font-size: 0.6rem; color: var(--muted); margin-top: 0.1rem; }

/* Parana */
.parana-times {
  display: flex; align-items: baseline; gap: 0.4rem; flex-wrap: wrap;
}
.parana-time-val { font-size: 1.1rem; font-weight: 300; letter-spacing: 0.04em; }
.parana-arrow { color: var(--muted); font-size: 0.8rem; }
.parana-day-sub { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; color: var(--muted); margin-top: 0.3rem; }
.parana-constraint-mini { font-family: 'JetBrains Mono', monospace; font-size: 0.58rem; color: var(--muted); margin-top: 0.4rem; line-height: 1.6; }
.parana-constraint-mini .key { color: var(--ink); }

.source-pill {
  font-family: 'JetBrains Mono', monospace; font-size: 0.55rem;
  letter-spacing: 0.1em; padding: 0.1rem 0.4rem;
  border-radius: 10px; text-transform: uppercase;
}
.source-se  { background: #e8f0e4; color: var(--tulsi); }
.source-api { background: #fdf0e4; color: var(--warn); }

.spinner {
  display: inline-block; width: 12px; height: 12px;
  border: 2px solid var(--border); border-top-color: var(--saffron);
  border-radius: 50%; animation: spin 0.8s linear infinite;
  vertical-align: middle; margin-right: 0.3rem;
}
@keyframes spin { to { transform: rotate(360deg); } }

.status-msg {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem; color: var(--muted);
  text-align: center; padding: 1rem;
}

footer {
  text-align: center; padding: 2rem 1rem;
  border-top: 1px solid var(--border);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.58rem; letter-spacing: 0.15em;
  color: var(--muted); text-transform: uppercase;
}
</style>
</head>
<body>

<div class="top-rule"></div>
<header>
  <div class="header-om">ॐ</div>
  <h1>Ekādaśī <span>Range Engine</span></h1>
  <div class="header-sub">Swiss Ephemeris · ISKCON Algorithm · Date Range List</div>
  <div class="engine-badges">
    <span class="badge badge-se">Swiss Ephemeris WASM</span>
    <span class="badge badge-isk">ISKCON Pañjikā Rule</span>
  </div>
</header>

<main>

  <div id="seStatus" class="se-status loading">
    <span class="spinner"></span> Loading Swiss Ephemeris WASM…
  </div>

  <div class="card">
    <div class="card-title">Location</div>
    <div class="loc-row">
      <div class="field">
        <label>Latitude</label>
        <input type="number" id="lat" step="0.0001" placeholder="23.4225">
      </div>
      <div class="field">
        <label>Longitude</label>
        <input type="number" id="lon" step="0.0001" placeholder="89.8610">
      </div>
      <button class="gps-btn" id="gpsBtn" onclick="getGPS()">⊕ GPS</button>
    </div>
    <div class="card-title" style="margin-top:0.6rem;">Date Range</div>
    <div class="input-grid">
      <div class="field">
        <label>From Date</label>
        <input type="date" id="dateFrom">
      </div>
      <div class="field">
        <label>To Date</label>
        <input type="date" id="dateTo">
      </div>
    </div>
    <button class="calc-btn" id="calcBtn" onclick="calculateRange()" disabled>Generate Ekādaśī List</button>
  </div>

  <div class="progress-bar-wrap" id="progressWrap">
    <div class="progress-bar" id="progressBar" style="width:0%"></div>
  </div>

  <div id="results-container">
    <div class="results-header">
      <span>Ekādaśī Calendar</span>
      <span id="resultsCount" class="results-count"></span>
    </div>
    <div id="resultsList"></div>
  </div>

</main>

<footer>
  Tithi · Sunrise · Aruṇodaya Test · Hari-vāsara Pāraṇā · Swiss Ephemeris Moshier Mode
</footer>

<script>
// ════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════
let _se = null, _seReady = false;

(function initSE() {
  if (typeof SwissEph === 'undefined') { setTimeout(initSE, 200); return; }
  SwissEph().then(se => {
    _se = se;
    _se.swe_set_ephe_path('');
    _seReady = true;
    const el = document.getElementById('seStatus');
    el.textContent = '✓ Swiss Ephemeris WASM ready — Moshier mode';
    el.className = 'se-status ready';
    document.getElementById('calcBtn').disabled = false;
  }).catch(e => {
    document.getElementById('seStatus').textContent = '✗ SE failed: ' + e.message;
  });
})();

// Default date range: today to +6 months
const today = new Date();
const sixMonths = new Date(today.getFullYear(), today.getMonth() + 6, today.getDate());
document.getElementById('dateFrom').value = today.toISOString().slice(0,10);
document.getElementById('dateTo').value   = sixMonths.toISOString().slice(0,10);

// ════════════════════════════════════════════════
//  GPS
// ════════════════════════════════════════════════
function getGPS() {
  const btn = document.getElementById('gpsBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  navigator.geolocation.getCurrentPosition(pos => {
    document.getElementById('lat').value = pos.coords.latitude.toFixed(4);
    document.getElementById('lon').value = pos.coords.longitude.toFixed(4);
    btn.disabled = false; btn.textContent = '⊕ GPS';
  }, err => {
    btn.disabled = false; btn.textContent = '⊕ GPS';
    alert('GPS failed: ' + err.message);
  });
}

// ════════════════════════════════════════════════
//  SE HELPERS
// ════════════════════════════════════════════════
function _toJD(d)   { return d.getTime() / 86400000 + 2440587.5; }
function _fromJD(j) { return new Date((j - 2440587.5) * 86400000); }

function _riseSet(dateLocal, lat, lon, riseFlag) {
  const midnight = new Date(dateLocal.getFullYear(), dateLocal.getMonth(), dateLocal.getDate(), 0, 0, 0);
  const jdMidnight = _toJD(midnight);
  const r = _se.swe_rise_trans(jdMidnight, 0, '', 4, riseFlag | 256, lon, lat, 0, 1013.25, 15);
  if (!r || r.flag < 0) throw new Error('swe_rise_trans failed');
  return _fromJD(r.tret[0]);
}
function getSunrise(d, lat, lon) { return _riseSet(d, lat, lon, 1); }
function getSunset(d, lat, lon)  { return _riseSet(d, lat, lon, 2); }

function _elongation(date) {
  const jd = _toJD(date), flags = 4 | 256;
  const moon = _se.swe_calc_ut(jd, 1, flags);
  const sun  = _se.swe_calc_ut(jd, 0, flags);
  return (((moon.longitude - sun.longitude) % 360) + 360) % 360;
}
function tithiIdx(date) { return Math.floor(_elongation(date) / 12) + 1; }

function findTithiEnd(idx, fromDate) {
  let lo = new Date(fromDate.getTime());
  let hi = new Date(fromDate.getTime() + 48 * 3600000);
  let t = new Date(lo.getTime() + 3600000), found = false;
  for (let i = 0; i < 60; i++) {
    if (tithiIdx(t) !== idx) { hi = t; found = true; break; }
    t = new Date(t.getTime() + 3600000);
  }
  if (!found) return null;
  lo = new Date(hi.getTime() - 3600000);
  for (let j = 0; j < 50; j++) {
    const mid = new Date((lo.getTime() + hi.getTime()) / 2);
    if (tithiIdx(mid) === idx) lo = mid; else hi = mid;
    if (hi - lo < 15000) break;
  }
  return new Date((lo.getTime() + hi.getTime()) / 2);
}

// ════════════════════════════════════════════════
//  EKADASHI NAME TABLES
// ════════════════════════════════════════════════
const EK_NAMES = {
  shukla:  { 0:'Kamada',1:'Mohini',2:'Nirjala',3:'Devshayani',4:'Shravana Putrada',5:'Parshva',6:'Pasankusha',7:'Prabodhini',8:'Utpanna',9:'Putrada',10:'Jaya',11:'Amalaki' },
  krishna: { 0:'Papamochani',1:'Varuthini',2:'Apara',3:'Yogini',4:'Kamika',5:'Aja',6:'Indira',7:'Rama',8:'Utpatti',9:'Saphala',10:'Shattila',11:'Vijaya' }
};
const EK_NAMES_BN = {
  shukla:  { 0:'কামদা',1:'মোহিনী',2:'নির্জলা',3:'দেবশয়নী',4:'শ্রাবণ পুত্রদা',5:'পার্শ্ব',6:'পাশাঙ্কুশা',7:'প্রবোধিনী',8:'উৎপন্না',9:'পুত্রদা',10:'জয়া',11:'আমলকী' },
  krishna: { 0:'পাপমোচনী',1:'বরূথিনী',2:'অপরা',3:'যোগিনী',4:'কামিকা',5:'অজা',6:'ইন্দিরা',7:'রামা',8:'উৎপত্তি',9:'সফলা',10:'ষটতিলা',11:'বিজয়া' }
};

function getEkName(date, paksha) {
  const jd = _toJD(date), T = (jd - 2451545) / 36525;
  const sun = _se.swe_calc_ut(jd, 0, 4 | 256);
  const sunSid = ((sun.longitude - (23.473 + T * 1.3966)) % 360 + 360) % 360;
  const mIdx = Math.floor(sunSid / 30) % 12;
  return {
    en: (EK_NAMES[paksha][mIdx] || 'Ekādaśī') + ' Ekādaśī',
    bn: (EK_NAMES_BN[paksha][mIdx] || 'একাদশী') + ' একাদশী'
  };
}

// ════════════════════════════════════════════════
//  FORMAT
// ════════════════════════════════════════════════
const WEEKDAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS   = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function fmtDate(d) {
  if (!d) return '—';
  return `${WEEKDAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}
function fmtTime(d) {
  if (!d) return '—';
  const h = d.getHours().toString().padStart(2,'0');
  const m = d.getMinutes().toString().padStart(2,'0');
  return `${h}:${m}`;
}
function fmtTimeS(d) {
  if (!d) return '—';
  const h = d.getHours().toString().padStart(2,'0');
  const m = d.getMinutes().toString().padStart(2,'0');
  const s = d.getSeconds().toString().padStart(2,'0');
  return `${h}:${m}:${s}`;
}

// ════════════════════════════════════════════════
//  CORE ENGINE (single ekadashi)
// ════════════════════════════════════════════════
function computeEkadashi(lat, lon, dayD) {
  // dayD = local calendar date where ekadashi is at sunrise
  const sunriseD  = getSunrise(dayD, lat, lon);
  const sunsetD   = getSunset(dayD, lat, lon);
  const paksha    = tithiIdx(sunriseD) === 11 ? 'shukla' : 'krishna';

  // Dashami end (D-1)
  const dayDm1 = new Date(dayD.getFullYear(), dayD.getMonth(), dayD.getDate() - 1);
  const srDm1  = getSunrise(dayDm1, lat, lon);
  const dashamiIdx = tithiIdx(srDm1);
  const dashamiEnd = findTithiEnd(dashamiIdx, srDm1);

  // Ekadashi end (D)
  const ekIdx  = tithiIdx(sunriseD);
  const ekEnd  = findTithiEnd(ekIdx, sunriseD);

  // Dvadashi end (D+1)
  const dayD1  = new Date(dayD.getFullYear(), dayD.getMonth(), dayD.getDate() + 1);
  const srD1   = getSunrise(dayD1, lat, lon);
  const dvIdx  = tithiIdx(srD1);
  const dvEnd  = findTithiEnd(dvIdx, srD1);

  // Ekadashi tithi START: binary search backwards from sunriseD for when tithi changed to ekadashi
  // Search from D-1 12:00 forward
  let ekStart = null;
  {
    const searchFrom = new Date(dayDm1.getFullYear(), dayDm1.getMonth(), dayDm1.getDate(), 12, 0, 0);
    // dashamiEnd is when dashami ended = ekadashi started
    ekStart = dashamiEnd;
  }

  // Arunodaya test on D+1
  const arunodaya = new Date(srD1.getTime() - 96 * 60000);
  const tAtArun   = tithiIdx(arunodaya);
  const dashamiContaminates = (tAtArun === 10 || tAtArun === 25);

  // Fast day
  const fastDay = dashamiContaminates ? dayD1 : dayD;
  const isMahadvadashi = dashamiContaminates;

  // Parana
  const paranaDay     = new Date(fastDay.getFullYear(), fastDay.getMonth(), fastDay.getDate() + 1);
  const paranaSunrise = getSunrise(paranaDay, lat, lon);
  const paranaSunset  = getSunset(paranaDay, lat, lon);
  const daylight      = paranaSunset - paranaSunrise;

  let hariVasaraEnd = null;
  if (ekEnd && dvEnd) {
    const dvDur = dvEnd - ekEnd;
    hariVasaraEnd = new Date(ekEnd.getTime() + dvDur / 4);
  }

  let paranaStart, paranaStartReason;
  if (hariVasaraEnd && hariVasaraEnd > paranaSunrise) {
    paranaStart = hariVasaraEnd; paranaStartReason = 'Hari-vāsara';
  } else {
    paranaStart = paranaSunrise; paranaStartReason = 'Sunrise';
  }

  const pratahkalaEnd = new Date(paranaSunrise.getTime() + daylight / 3);
  let paranaEnd, paranaEndReason;
  if (dvEnd && dvEnd < pratahkalaEnd) {
    paranaEnd = dvEnd; paranaEndReason = 'Dvādaśī ends';
  } else {
    paranaEnd = pratahkalaEnd; paranaEndReason = 'Prātaḥkāla (1/3 day)';
  }

  const ekName = getEkName(dayD, paksha);

  return {
    paksha, ekName, fastDay, isMahadvadashi,
    dayD,
    ekStart, ekEnd, dvEnd, dashamiEnd,
    sunriseD, sunsetD,
    paranaDay, paranaStart, paranaEnd, paranaStartReason, paranaEndReason,
    hariVasaraEnd, pratahkalaEnd,
    arunodaya, tAtArun, dashamiContaminates
  };
}

// ════════════════════════════════════════════════
//  SCAN DATE RANGE
// ════════════════════════════════════════════════
async function calculateRange() {
  const lat = parseFloat(document.getElementById('lat').value);
  const lon = parseFloat(document.getElementById('lon').value);
  const fromStr = document.getElementById('dateFrom').value;
  const toStr   = document.getElementById('dateTo').value;

  if (!lat || !lon) { alert('Please enter latitude and longitude.'); return; }
  if (!fromStr || !toStr) { alert('Please enter both dates.'); return; }
  if (!_seReady) { alert('Swiss Ephemeris still loading.'); return; }

  const [fy,fm,fd] = fromStr.split('-').map(Number);
  const [ty,tm,td] = toStr.split('-').map(Number);
  const fromDate = new Date(fy, fm-1, fd);
  const toDate   = new Date(ty, tm-1, td);

  if (toDate <= fromDate) { alert('End date must be after start date.'); return; }

  const totalDays = Math.round((toDate - fromDate) / 86400000);
  if (totalDays > 730) { alert('Maximum 2-year range supported.'); return; }

  const btn = document.getElementById('calcBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Scanning…';

  const rc = document.getElementById('results-container');
  const rl = document.getElementById('resultsList');
  rc.classList.remove('visible');
  rl.innerHTML = '<div class="status-msg"><span class="spinner"></span> Scanning dates…</div>';
  rc.classList.add('visible');

  const pw = document.getElementById('progressWrap');
  const pb = document.getElementById('progressBar');
  pw.classList.add('visible'); pb.style.width = '0%';

  await new Promise(r => setTimeout(r, 50)); // let UI repaint

  const ekadashis = [];
  const seen = new Set(); // avoid duplicates (same ekadashi from 2-day window)

  for (let i = 0; i <= totalDays; i++) {
    const testDay = new Date(fromDate.getFullYear(), fromDate.getMonth(), fromDate.getDate() + i);
    try {
      const sunrise = getSunrise(testDay, lat, lon);
      const ti = tithiIdx(sunrise);
      if (ti === 11 || ti === 27) {
        const key = testDay.toISOString().slice(0,10);
        if (!seen.has(key)) {
          seen.add(key);
          ekadashis.push(testDay);
        }
      }
    } catch(e) { /* skip */ }

    if (i % 5 === 0) {
      pb.style.width = Math.round(i / totalDays * 100) + '%';
      await new Promise(r => setTimeout(r, 0));
    }
  }

  pb.style.width = '100%';
  rl.innerHTML = '';

  if (ekadashis.length === 0) {
    rl.innerHTML = '<div class="status-msg">No Ekādaśī found in this range.</div>';
    document.getElementById('resultsCount').textContent = '0 found';
    btn.disabled = false; btn.textContent = 'Generate Ekādaśī List';
    return;
  }

  document.getElementById('resultsCount').textContent = ekadashis.length + ' found';

  // Render one by one with small delays so page doesn't freeze
  for (let idx = 0; idx < ekadashis.length; idx++) {
    const day = ekadashis[idx];
    try {
      const r = computeEkadashi(lat, lon, day);
      const card = buildCard(r, idx + 1);
      rl.appendChild(card);
      pb.style.width = Math.round((ekadashis.length / ekadashis.length) * 100) + '%';
    } catch(e) {
      const errDiv = document.createElement('div');
      errDiv.className = 'status-msg';
      errDiv.textContent = `Error on ${fmtDate(day)}: ${e.message}`;
      rl.appendChild(errDiv);
    }
    if (idx % 2 === 0) await new Promise(r => setTimeout(r, 0));
  }

  pw.classList.remove('visible');
  btn.disabled = false; btn.textContent = 'Generate Ekādaśī List';
}

// ════════════════════════════════════════════════
//  BUILD CARD HTML
// ════════════════════════════════════════════════
function buildCard(r, serial) {
  const div = document.createElement('div');
  div.className = 'ek-card';
  div.style.animationDelay = (serial * 0.04) + 's';

  const pakshaTag  = r.paksha === 'shukla' ? 'Gaura Pakṣa' : 'Kṛṣṇa Pakṣa';
  const dotClass   = r.paksha === 'shukla' ? 'dot-shukla' : 'dot-krishna';
  const tagClass   = r.paksha === 'shukla' ? 'tag-shukla' : 'tag-krishna';
  const mahaTag    = r.isMahadvadashi ? `<span class="mahadvadashi-tag">Mahādvādaśī</span>` : '';

  // Ekadashi tithi start/end
  const ekStartStr  = r.ekStart ? fmtTimeS(r.ekStart) : '—';
  const ekStartDate = r.ekStart ? fmtDate(r.ekStart) : '';
  const ekEndStr    = r.ekEnd   ? fmtTimeS(r.ekEnd)   : '—';
  const ekEndDate   = r.ekEnd   ? fmtDate(r.ekEnd)     : '';

  div.innerHTML = `
    <div class="ek-card-header">
      <span class="ek-serial">#${serial}</span>
      <div class="ek-paksha-dot ${dotClass}"></div>
      <div class="ek-name-block">
        <div class="ek-name-en">${r.ekName.en}</div>
        <div class="ek-name-bn">${r.ekName.bn}</div>
      </div>
      <span class="ek-paksha-tag ${tagClass}">${pakshaTag}</span>
      ${mahaTag}
    </div>

    <div class="ek-card-body">

      <!-- Column 1: Fast Date -->
      <div class="ek-section">
        <div class="ek-section-title">Fast Day</div>
        <div class="ek-fast-date">${fmtDate(r.fastDay)}</div>
        <div class="ek-fast-day">${r.isMahadvadashi ? 'Mahādvādaśī Fast' : 'Śuddhā Ekādaśī Fast'}</div>
      </div>

      <!-- Column 2: Ekadashi Tithi Window -->
      <div class="ek-section">
        <div class="ek-section-title">Ekādaśī Tithi</div>
        <div class="ek-tithi-row">
          <span class="tithi-label">Start</span>
          <span class="tithi-time">${ekStartStr}</span>
        </div>
        ${ekStartDate ? `<div class="tithi-date-sub">${ekStartDate}</div>` : ''}
        <div class="ek-tithi-row" style="margin-top:0.5rem">
          <span class="tithi-label">End</span>
          <span class="tithi-time">${ekEndStr}</span>
        </div>
        ${ekEndDate ? `<div class="tithi-date-sub">${ekEndDate}</div>` : ''}
      </div>

      <!-- Column 3: Parana -->
      <div class="ek-section">
        <div class="ek-section-title">Pāraṇā — ${fmtDate(r.paranaDay)}</div>
        <div class="parana-times">
          <span class="parana-time-val">${fmtTime(r.paranaStart)}</span>
          <span class="parana-arrow">→</span>
          <span class="parana-time-val">${fmtTime(r.paranaEnd)}</span>
        </div>
        <div class="parana-constraint-mini">
          <span class="key">Start:</span> ${r.paranaStartReason}<br>
          <span class="key">End:</span> ${r.paranaEndReason}
        </div>
      </div>

    </div>
  `;
  return div;
}
</script>
