<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Vedic Panchanga</title>
<meta name="theme-color" content="#d97706"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Panchanga"/>
<link rel="manifest" href="./manifest.json"/>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%230d0d0f' rx='80'/%3E%3Ccircle cx='256' cy='220' r='110' fill='none' stroke='%23f5a623' stroke-width='18'/%3E%3Ccircle cx='256' cy='220' r='18' fill='%23f5a623'/%3E%3Ctext x='256' y='430' text-anchor='middle' font-family='serif' font-size='72' fill='%23f5a623'%3Eॐ%3C/text%3E%3C/svg%3E"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/suncalc@1.9.0/suncalc.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d0f;--card:#16161a;--border:#2a2a35;
  --primary:#f5a623;--pd:rgba(245,166,35,0.15);
  --fg:#e8e8f0;--muted:#6b6b85;--red:#ef4444;--green:#22c55e;
}
body{background:var(--bg);color:var(--fg);font-family:'Inter',sans-serif;min-height:100vh;overscroll-behavior:none}
.app{max-width:680px;margin:0 auto;padding:0 0 80px}

/* ── header ── */
header{text-align:center;padding:env(safe-area-inset-top,20px) 20px 6px}
.title{font-family:'Noto Serif',serif;font-size:1.05rem;color:var(--primary);letter-spacing:.2em;text-transform:uppercase}
.gaurabda{font-size:.58rem;color:var(--muted);letter-spacing:.15em;text-transform:uppercase;margin-top:3px}
.location{font-size:.58rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:5px;display:flex;align-items:center;justify-content:center;gap:4px}
.loc-dot{width:5px;height:5px;background:var(--primary);border-radius:50%}

/* ── clock ── */
.clock-wrap{text-align:center;padding:12px 20px 4px;position:relative}
.om-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:.03;font-size:110px;font-family:'Noto Serif',serif}
#clock{font-family:'Noto Serif',serif;font-size:3.2rem;font-weight:700;color:var(--primary);letter-spacing:-.03em;text-shadow:0 0 40px rgba(245,166,35,.3)}
.vaar-name{font-family:'Noto Serif',serif;font-size:1.6rem;font-weight:500;text-align:center;margin-top:2px}
.month-line{font-size:.72rem;color:var(--primary);letter-spacing:.1em;text-transform:uppercase;text-align:center;margin-top:5px}
.vaishnav-line{font-size:.65rem;color:var(--muted);font-style:italic;font-family:'Noto Serif',serif;text-align:center;margin-top:2px}

/* ── vaar strip ── */
.vaar-strip{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;scrollbar-width:none}
.vaar-strip::-webkit-scrollbar{display:none}
.vaar-btn{flex:1;min-width:70px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 10px;border-radius:14px;border:1px solid var(--border);background:rgba(255,255,255,.03);cursor:pointer;transition:all .15s;color:var(--fg)}
.vaar-btn.today{border-color:rgba(245,166,35,.5);background:var(--pd)}
.vaar-btn.selected{border-color:#60a5fa;background:rgba(96,165,250,.12)}
.vaar-btn .icon{font-size:1.2rem}
.vaar-btn .name{font-size:.58rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.vaar-btn .name-bn{font-size:.62rem;color:var(--muted)}
.vaar-btn.today .name,.vaar-btn.today .name-bn{color:var(--primary)}
.vaar-btn.selected .name,.vaar-btn.selected .name-bn{color:#93c5fd}

/* ── NOW panel ── */
.now-panel{margin:6px 16px 0;border-radius:16px;border:1px solid rgba(245,166,35,.3);background:linear-gradient(135deg,rgba(245,166,35,.07),rgba(245,166,35,.03));overflow:hidden}
.now-panel-head{padding:10px 14px 6px;display:flex;align-items:center;gap:6px}
.now-panel-head .pulse{width:7px;height:7px;background:var(--primary);border-radius:50%;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
.now-panel-head span{font-size:.58rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(245,166,35,.7)}
.now-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:rgba(245,166,35,.1)}
/* on iPad 3 cols for the now-grid */
@media(min-width:540px){.now-grid{grid-template-columns:repeat(3,1fr)}}
.now-cell{background:var(--bg);padding:10px 14px}
.now-cell-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}
.now-cell-label{font-size:.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.now-cell-status{font-size:.5rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:1px 5px;border-radius:4px}
.now-cell-status.active{background:rgba(245,166,35,.2);color:var(--primary)}
.now-cell-status.soon{background:rgba(96,165,250,.15);color:#93c5fd}
.now-cell-name{font-family:'Noto Serif',serif;font-size:.82rem;font-weight:600;color:var(--fg);margin-bottom:2px}
.now-cell-effect{font-size:.58rem;color:var(--muted);line-height:1.4;margin-bottom:4px}
.now-cell-time{font-size:.58rem;font-family:monospace;color:rgba(107,107,133,.7);line-height:1.4}
.now-cell.warn .now-cell-name{color:#f87171}
.now-cell.warn{background:rgba(239,68,68,.04)}
.now-cell.good .now-cell-name{color:var(--primary)}

/* ── section headers ── */
.sec-head{font-size:.58rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(245,166,35,.7);display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sec-head::before{content:'';width:14px;height:1px;background:rgba(245,166,35,.3)}
.sec-head::after{content:'';flex:1;height:1px;background:var(--border)}
.sec-head.red{color:rgba(239,68,68,.7)}.sec-head.red::before{background:rgba(239,68,68,.3)}
.sec-head.green{color:rgba(34,197,94,.7)}.sec-head.green::before{background:rgba(34,197,94,.3)}
.divider{display:flex;align-items:center;justify-content:center;gap:12px;padding:16px 0;opacity:.2}
.divider::before,.divider::after{content:'';flex:0 0 40px;height:1px;background:var(--border)}
section{padding:0 16px}

/* ── tithi toggle ── */
.tithi-toggle{margin:8px 16px 6px;padding:11px 16px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:space-between;color:var(--fg);width:calc(100% - 32px)}
.tithi-toggle span{font-size:.62rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:rgba(245,166,35,.7)}
.chevron{font-size:.75rem;color:var(--muted);transition:transform .25s;display:inline-block}
.tithi-toggle.open .chevron{transform:rotate(180deg)}

/* ── month grid ── */
.month-grid-wrap{overflow:hidden;max-height:0;transition:max-height .35s ease}
.month-grid-wrap.open{max-height:2400px}
.month-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:10px 16px}
@media(min-width:540px){.month-grid{grid-template-columns:repeat(3,1fr)}}
.paksha-label{grid-column:1/-1;font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:8px;padding:4px 0}
.paksha-label.s{color:rgba(245,166,35,.6)}.paksha-label.k{color:var(--muted)}
.paksha-label::after{content:'';flex:1;height:1px;background:var(--border)}
.tcell{border-radius:11px;border:1px solid var(--border);background:rgba(255,255,255,.02);padding:9px 11px}
.tcell.active{background:var(--pd);border-color:rgba(245,166,35,.5)}
.tcell-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:3px}
.tcell-num{font-size:.52rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tcell.active .tcell-num{color:var(--primary)}
.now-badge{font-size:.48rem;background:var(--pd);color:var(--primary);padding:1px 5px;border-radius:4px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.tcell-name{font-family:'Noto Serif',serif;font-size:.72rem;font-weight:600;color:rgba(232,232,240,.85)}
.tcell.active .tcell-name{color:var(--primary)}
.tcell-start{font-size:.52rem;color:rgba(107,107,133,.7);font-family:monospace;margin-top:3px}
.tcell-end{font-size:.52rem;color:rgba(107,107,133,.45);font-family:monospace}

/* ── day boundary grid ── */
.db-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media(min-width:540px){.db-grid{grid-template-columns:repeat(4,1fr)}}
.db-card{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:12px;padding:11px 13px}
.db-label{font-size:.52rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px;display:flex;align-items:center;gap:5px}
.db-time{font-family:monospace;font-size:.82rem;font-weight:500;color:rgba(232,232,240,.9)}
.db-time .sub{font-size:.68rem;color:var(--muted)}

/* ── panchanga rows ── */
.p-row{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;border-radius:12px;background:rgba(255,255,255,.025);border:1px solid var(--border);position:relative;padding-left:34px}
.p-row::before{content:'';position:absolute;left:11px;top:50%;transform:translateY(-50%);width:7px;height:7px;border-radius:50%;border:2px solid var(--bg)}
.p-row.sukla::before{background:var(--primary)}.p-row.krishna::before{background:#94a3b8}
.p-row-name{font-family:'Noto Serif',serif;font-size:.82rem;font-weight:600}
.p-row-badge{font-size:.52rem;padding:2px 6px;border-radius:20px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;margin-left:5px}
.p-row-badge.s{background:var(--pd);color:var(--primary);border:1px solid rgba(245,166,35,.2)}
.p-row-badge.k{background:rgba(148,163,184,.1);color:#94a3b8;border:1px solid rgba(148,163,184,.2)}
.p-row-time{font-size:.62rem;color:var(--muted);font-family:monospace;text-align:right;line-height:1.5}

/* ── muhurta rows ── */
.m-row{display:flex;align-items:flex-start;gap:11px;padding:11px 13px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.02)}
.m-row.auspicious{border-color:rgba(34,197,94,.15);background:rgba(34,197,94,.03)}
.m-row.inauspicious{border-color:rgba(239,68,68,.15);background:rgba(239,68,68,.03)}
.m-row.now-active{box-shadow:0 0 0 1px var(--primary);background:var(--pd)}
.m-icon{font-size:1.2rem;flex-shrink:0;margin-top:1px}
.m-body{flex:1;min-width:0}
.m-label{font-size:.68rem;font-weight:600}
.m-desc{font-size:.58rem;color:var(--muted);margin-top:2px;line-height:1.4}
.m-time{font-size:.62rem;font-family:monospace;color:var(--muted);text-align:right;flex-shrink:0;line-height:1.5;white-space:nowrap}

/* ── special yoga ── */
.yoga-card{background:rgba(245,166,35,.05);border:1px solid rgba(245,166,35,.2);border-radius:14px;padding:14px 16px;display:flex;align-items:flex-start;gap:12px}
.yoga-icon{font-size:1.5rem;flex-shrink:0;margin-top:2px}
.yoga-name{font-family:'Noto Serif',serif;font-size:.9rem;font-weight:500;color:#fbbf24}
.yoga-desc{font-size:.62rem;color:rgba(251,191,36,.55);margin-top:2px;line-height:1.5}
.yoga-time{font-size:.58rem;font-family:monospace;background:rgba(245,166,35,.1);color:rgba(245,166,35,.7);border:1px solid rgba(245,166,35,.2);padding:3px 8px;border-radius:6px;margin-top:6px;display:inline-block}

/* ── viewing bar ── */
.viewing-bar{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 16px 0}
.viewing-chip{font-size:.58rem;color:#93c5fd;background:rgba(96,165,250,.1);border:1px solid rgba(96,165,250,.25);padding:4px 12px;border-radius:20px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.back-btn{font-size:.52rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;cursor:pointer;background:none;border:none;padding:0}
.back-btn:hover{color:var(--primary)}

.sub-label{font-size:.58rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px;margin-left:2px}
.space-y>*+*{margin-top:7px}
.adhik-badge{font-size:.52rem;font-weight:700;padding:2px 6px;border-radius:5px;background:rgba(245,166,35,.15);color:#f59e0b;border:1px solid rgba(245,166,35,.3);letter-spacing:.08em;text-transform:uppercase;margin-right:4px}

/* ── loading ── */
#loading{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.spin{animation:spin 1s linear infinite;font-size:1.5rem;color:var(--primary)}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
  <div id="loading">
    <div class="spin">↻</div>
    <div style="font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-family:'Noto Serif',serif">Computing Panchanga…</div>
  </div>
  <div id="main" style="display:none">
    <header>
      <div class="title">Vedic Panchanga</div>
      <div class="gaurabda" id="gaurabda"></div>
      <div class="location"><span class="loc-dot"></span><span id="loc-text">Locating…</span></div>
    </header>

    <div class="clock-wrap">
      <div class="om-bg">ॐ</div>
      <div id="clock"></div>
    </div>
    <div class="vaar-name" id="vaar-name" style="font-family:'Noto Serif',serif"></div>
    <div class="month-line" id="month-line"></div>
    <div class="vaishnav-line" id="vaishnav-line"></div>

    <div class="vaar-strip" id="vaar-strip"></div>

    <!-- NOW PANEL -->
    <div class="now-panel" id="now-panel">
      <div class="now-panel-head">
        <div class="pulse"></div>
        <span id="now-panel-title">Right Now &amp; Coming Soon</span>
      </div>
      <div class="now-grid" id="now-grid"></div>
    </div>

    <!-- viewing label for selected vaar -->
    <div id="viewing-bar" style="display:none">
      <div class="viewing-bar">
        <span class="viewing-chip" id="viewing-label"></span>
        <button class="back-btn" onclick="clearSelectedVaar()">← Back to today</button>
      </div>
    </div>

    <button class="tithi-toggle" id="tithi-toggle" onclick="toggleGrid()">
      <span>🌙 &nbsp;Lunar Month — All 30 Tithis</span>
      <span class="chevron">▾</span>
    </button>
    <div class="month-grid-wrap" id="month-grid-wrap">
      <div class="month-grid" id="month-grid"></div>
    </div>

    <div class="divider">✧</div>

    <section id="day-bounds-sec">
      <div class="sec-head">Day Boundaries</div>
      <div class="db-grid" id="db-grid"></div>
    </section>

    <div class="divider">✧</div>

    <section>
      <div class="sec-head">Panchanga Angas</div>
      <div class="sub-label">Tithi</div>
      <div class="space-y" id="tithi-rows"></div>
      <br>
      <div class="sub-label">Nakshatra</div>
      <div class="space-y" id="nakshatra-rows"></div>
      <br>
      <div class="sub-label">Yoga</div>
      <div class="space-y" id="yoga-rows"></div>
      <br>
      <div class="sub-label">Karana</div>
      <div class="space-y" id="karana-rows"></div>
    </section>

    <div class="divider">✧</div>

    <section>
      <div class="sec-head green">Auspicious Periods</div>
      <div class="space-y" id="ausp-rows"></div>
    </section>

    <div class="divider">✧</div>

    <section>
      <div class="sec-head red">Inauspicious Periods</div>
      <div class="space-y" id="inaup-rows"></div>
    </section>

    <div id="special-yoga-sec" style="display:none">
      <div class="divider">✧</div>
      <section>
        <div class="sec-head" style="color:rgba(251,191,36,.7)">Special Yogas</div>
        <div class="space-y" id="yoga-cards"></div>
      </section>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// ASTRONOMY
// ═══════════════════════════════════════════════════════════════
function toRad(d){return d*Math.PI/180}
function norm(d){let x=d%360;return x<0?x+360:x}
function dateToJD(date){
  const Y=date.getUTCFullYear(),M=date.getUTCMonth()+1;
  const day=date.getUTCDate()+date.getUTCHours()/24+date.getUTCMinutes()/1440+date.getUTCSeconds()/86400;
  let y=Y,m=M;if(m<=2){y--;m+=12}
  const A=Math.floor(y/100),B=2-A+Math.floor(A/4);
  return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+day+B-1524.5;
}
function jdToDate(jd){return new Date((jd-2440587.5)*86400000)}
function sunLong(jd){
  const T=(jd-2451545)/36525;
  let L=280.46646+36000.76983*T+.0003032*T*T;
  let M=norm(357.52911+35999.05029*T-.0001537*T*T);
  const Mr=toRad(M);
  const C=(1.914602-.004817*T-.000014*T*T)*Math.sin(Mr)+(0.019993-.000101*T)*Math.sin(2*Mr)+.000289*Math.sin(3*Mr);
  return norm(L+C);
}
function moonLong(jd){
  const T=(jd-2451545)/36525;
  let L=norm(218.3164477+481267.88123421*T-.0015786*T*T+T*T*T/538841-T*T*T*T/65194000);
  let M=norm(357.5291092+35999.0502909*T-.0001536*T*T+T*T*T/24490000);
  let Mp=norm(134.9633964+477198.8675055*T+.0087414*T*T+T*T*T/69699-T*T*T*T/14712000);
  let F=norm(93.292095+483202.0175233*T-.0036539*T*T-T*T*T/3526000+T*T*T*T/863310000);
  let D=norm(297.8501921+445267.1114034*T-.0018819*T*T+T*T*T/545868-T*T*T*T/113065000);
  const A1=toRad(norm(119.75+131.849*T)),A2=toRad(norm(53.09+479264.29*T));
  const Mr2=toRad(M),Mpr=toRad(Mp),Fr=toRad(F),Dr=toRad(D),L0r=toRad(L);
  let s=0;
  s+=6288774*Math.sin(Mpr);s+=1274027*Math.sin(2*Dr-Mpr);s+=658314*Math.sin(2*Dr);
  s+=213618*Math.sin(2*Mpr);s-=185116*Math.sin(Mr2);s-=114332*Math.sin(2*Fr);
  s+=58793*Math.sin(2*Dr-2*Mpr);s+=57066*Math.sin(2*Dr-Mr2-Mpr);s+=53322*Math.sin(2*Dr+Mpr);
  s+=45758*Math.sin(2*Dr-Mr2);s-=40923*Math.sin(Mr2-Mpr);s-=34720*Math.sin(Dr);
  s-=30383*Math.sin(Mr2+Mpr);s+=15327*Math.sin(2*Dr-2*Fr);s-=12528*Math.sin(Mpr+2*Fr);
  s+=10980*Math.sin(Mpr-2*Fr);s+=10675*Math.sin(4*Dr-Mpr);s+=10034*Math.sin(3*Mpr);
  s+=8548*Math.sin(4*Dr-2*Mpr);s-=7888*Math.sin(2*Dr+Mr2-Mpr);s-=6766*Math.sin(2*Dr+Mr2);
  s-=5163*Math.sin(Dr-Mpr);s+=4987*Math.sin(Dr+Mr2);s+=4036*Math.sin(2*Dr-Mr2+Mpr);
  s+=3994*Math.sin(2*Dr+2*Mpr);s+=3861*Math.sin(4*Dr);s+=3665*Math.sin(2*Dr-3*Mpr);
  s-=2689*Math.sin(Mr2-2*Mpr);s-=2602*Math.sin(2*Dr-Mpr+2*Fr);
  s+=2390*Math.sin(2*Dr-Mr2-2*Mpr);s-=2348*Math.sin(Dr+Mpr);s+=2236*Math.sin(2*Dr-2*Mr2);
  s-=2120*Math.sin(Mr2+2*Mpr);s-=2069*Math.sin(2*Mr2);s+=2048*Math.sin(2*Dr-2*Mr2-Mpr);
  s-=1773*Math.sin(2*Dr+Mpr-2*Fr);s-=1595*Math.sin(2*Dr+2*Fr);s+=1215*Math.sin(4*Dr-Mr2-Mpr);
  s-=1110*Math.sin(2*Mpr+2*Fr);
  s+=3958*Math.sin(A1);s+=1962*Math.sin(L0r-Fr);s+=318*Math.sin(A2);
  return norm(L+s/1000000);
}
function findElong(jdS,jdE,target){
  let lo=jdS,hi=jdE;
  for(let i=0;i<52;i++){const m=(lo+hi)/2;const d=norm(norm(moonLong(m)-sunLong(m))-target);d<180?hi=m:lo=m}
  return(lo+hi)/2;
}
function findMoonLng(jdS,jdE,target){
  let lo=jdS,hi=jdE;
  for(let i=0;i<52;i++){const m=(lo+hi)/2;const d=norm(moonLong(m)-target);d<180?hi=m:lo=m}
  return(lo+hi)/2;
}
function findYoga(jdS,jdE,target){
  let lo=jdS,hi=jdE;
  for(let i=0;i<52;i++){const m=(lo+hi)/2;const d=norm(norm(moonLong(m)+sunLong(m))-target);d<180?hi=m:lo=m}
  return(lo+hi)/2;
}

// VEDIC CALCULATIONS
// ═══════════════════════════════════════════════════════════════
function tithiIdx(jd){return Math.floor(norm(moonLong(jd)-sunLong(jd))/12)}

function getTithiPeriods(jd,count=10){
  const periods=[];let s=jd-0.5;
  for(let i=0;i<count+1;i++){
    const idx=tithiIdx(s);
    const end=findElong(s,s+2,((idx+1)%30)*12);
    periods.push({index:idx,name:TITHI[idx],paksha:idx<15?'Sukla':'Krishna',startJD:s,endJD:end});
    s=end+.0001;
  }
  for(let i=1;i<periods.length;i++)periods[i].startJD=periods[i-1].endJD;
  periods[0].startJD=findElong(jd-2,jd,periods[0].index*12);
  return periods;
}

function getLunarMonthTithis(jd){
  const elong=norm(moonLong(jd)-sunLong(jd));
  const prevNM=findElong(jd-(elong/360)*29.53-2,jd,0);
  const periods=[];let s=prevNM+.0001;
  for(let i=0;i<30;i++){
    const idx=tithiIdx(s);
    const end=findElong(s,s+2,((idx+1)%30)*12);
    periods.push({index:idx,name:TITHI[idx],paksha:idx<15?'Sukla':'Krishna',startJD:s,endJD:end});
    s=end+.0001;
  }
  for(let i=1;i<periods.length;i++)periods[i].startJD=periods[i-1].endJD;
  periods[0].startJD=prevNM;
  return periods;
}

function getNakshatraPeriods(jd,count=3){
  const SPAN=360/27;const periods=[];
  const trueStart=findMoonLng(jd-2,jd,Math.floor(moonLong(jd)/SPAN)*SPAN);
  let s=trueStart;
  for(let i=0;i<count;i++){
    const idx=Math.floor(moonLong(s)/SPAN)%27;
    const end=findMoonLng(s,s+3,((idx+1)%27)*SPAN);
    periods.push({index:idx,name:NAKSHATRA[idx],startJD:s,endJD:end});
    s=end+.0001;
  }
  return periods;
}

function getYogaPeriods(jd,count=3){
  const SPAN=360/27;const periods=[];
  const c0=norm(moonLong(jd)+sunLong(jd));
  const trueStart=findYoga(jd-2,jd,Math.floor(c0/SPAN)*SPAN);
  let s=trueStart;
  for(let i=0;i<count;i++){
    const c=norm(moonLong(s)+sunLong(s));
    const idx=Math.floor(c/SPAN)%27;
    const end=findYoga(s,s+4,((idx+1)%27)*SPAN);
    periods.push({index:idx,name:YOGA_N[idx],startJD:s,endJD:end});
    s=end+.0001;
  }
  return periods;
}

function getKaranaPeriods(jd,count=5){
  const periods=[];
  const idx0=Math.floor(norm(moonLong(jd)-sunLong(jd))/6);
  const trueStart=findElong(jd-1.5,jd,idx0*6);
  let s=trueStart;
  for(let i=0;i<count;i++){
    const idx=Math.floor(norm(moonLong(s)-sunLong(s))/6);
    const end=findElong(s,s+1.5,((idx+1)%60)*6);
    periods.push({index:idx,name:karName(idx),startJD:s,endJD:end});
    s=end+.0001;
  }
  return periods;
}

function gaurabda(date){
  const y=date.getFullYear(),m=date.getMonth()+1,d=date.getDate();
  return y-1486-((m<3||(m===3&&d<15))?1:0);
}
function hinduMonth(jd){const idx=Math.floor(sunLong(jd)/30)%12;return{name:HM[idx],vaishnavName:VM[idx]}}
function adhikMaas(jd){
  const elong=norm(moonLong(jd)-sunLong(jd));
  const prevNM=findElong(jd-(elong/360)*29.53-2,jd,0);
  const nextNM=findElong(jd,jd+32,0);
  const sS=sunLong(prevNM),sE=sunLong(nextNM);
  const moved=norm(sE-sS);
  const dist=norm((Math.floor(sS/30)+1)*30-sS);
  const isAdhik=dist>=moved;
  const sunMid=norm(sS+moved/2);
  return{isAdhik,nextMonthName:HM[Math.floor(sE/30)%12],isPurushottam:isAdhik&&sunMid>=60&&sunMid<90};
}

// MUHURTA — computed from a SPECIFIC vaar's sunrise/sunset
// ═══════════════════════════════════════════════════════════════
const RAHU=[8,2,7,5,6,4,3],YAMA=[4,8,3,7,2,6,5],GULI=[7,6,5,4,3,2,1];
function dayParts(sr,ss){
  const parts=[new Date(+sr)];const ms=+ss-+sr;
  for(let i=1;i<=8;i++)parts.push(new Date(+sr+i*(ms/8)));
  return parts;
}
function partPeriod(arr,wd,sr,ss){const p=dayParts(sr,ss);const i=arr[wd]-1;return{start:p[i],end:p[i+1]}}
const DUR={0:[5,8],1:[7,15],2:[1,8],3:[3,11],4:[6,14],5:[7,9],6:[3,15]};
const VARJ_OFF=[7,4,10,4,14,8,6,2,4,4,12,2,6,4,4,6,2,4,4,4,4,4,4,4,2,4,4];

function getMuhurtaData(vaar,lat,lng){
  const{sunrise,sunset,brahmaMuhurtaStart,brahmaMuhurtaEnd}=vaar;
  const wd=sunrise.getDay();
  // Get accurate solar noon and moon times for THIS vaar's date
  const t=SunCalc.getTimes(sunrise,lat,lng);
  const noon=t.solarNoon;
  const mt=SunCalc.getMoonTimes(sunrise,lat,lng);
  const moonrise=mt.rise||null,moonset=mt.set||null;
  // Next day sunrise for nishita
  const nextDay=new Date(+sunrise+86400000);
  const nextSR=SunCalc.getTimes(nextDay,lat,lng).sunrise;
  const midnight=new Date((+sunset+nextSR.getTime())/2);
  const durMs=(+sunset-+sunrise)/15;
  // Nakshatra index for this vaar (use JD of this vaar's sunrise)
  const jdSR=dateToJD(sunrise);
  const nakIdx=Math.floor(moonLong(jdSR)/(360/27))%27;
  const varjOff=VARJ_OFF[nakIdx]*48*60*1000;
  return{
    sunrise,sunset,noon,moonrise,moonset,wd,
    brahmaMuhurta:{start:brahmaMuhurtaStart,end:brahmaMuhurtaEnd},
    sandhyaEnd:new Date(+sunrise+48*60*1000),
    sunsetSandhyaStart:new Date(+sunset-48*60*1000),
    rahuKalam:partPeriod(RAHU,wd,sunrise,sunset),
    yamaganda:partPeriod(YAMA,wd,sunrise,sunset),
    gulika:partPeriod(GULI,wd,sunrise,sunset),
    abhijit:{start:new Date(+noon-24*60*1000),end:new Date(+noon+24*60*1000)},
    vijaya:{start:new Date(+noon+(+sunset-+noon)*2/5),end:new Date(+noon+(+sunset-+noon)*2/5+48*60*1000)},
    godhuli:{start:new Date(+sunset-24*60*1000),end:new Date(+sunset+24*60*1000)},
    nishita:{start:new Date(+midnight-24*60*1000),end:new Date(+midnight+24*60*1000)},
    durMuhurtas:(DUR[wd]||[]).map(pos=>({start:new Date(+sunrise+(pos-1)*durMs),end:new Date(+sunrise+pos*durMs)})),
    varjyam:moonrise?{start:new Date(+moonrise+varjOff),end:new Date(+moonrise+varjOff+38*60*1000)}:null,
    amritaKala:moonrise?{start:new Date(+moonrise+varjOff+68*60*1000),end:new Date(+moonrise+varjOff+106*60*1000)}:null,
  };
}

// ═══════════════════════════════════════════════════════════════
// VAAR STRIP — each button represents a DIFFERENT calendar day
// ═══════════════════════════════════════════════════════════════
function getBM(date,lat,lng){
  const t=SunCalc.getTimes(date,lat,lng);
  return new Date(+t.sunrise-96*60*1000);
}
function getVedicVaarIdx(now,lat,lng){
  const todayBM=getBM(now,lat,lng);
  const tomorrow=new Date(+now+86400000);
  const tomorrowBM=getBM(tomorrow,lat,lng);
  if(now>=tomorrowBM)return tomorrow.getDay();
  if(now<todayBM){const y=new Date(+now-86400000);return y.getDay();}
  return now.getDay();
}
function getVaarStrip(now,lat,lng){
  const activeIdx=getVedicVaarIdx(now,lat,lng);
  return VAAR.map((name,i)=>{
    // Offset from today: 0=today, 1=tomorrow, -1=yesterday etc wrapped in 7
    const diff=((i-activeIdx)+7)%7;
    const dayOffset=diff>3?diff-7:diff;  // -3 to +3
    const td=new Date(now);
    td.setDate(td.getDate()+dayOffset);
    // Use noon of that day so sunrise is reliable
    const noon=new Date(td.getFullYear(),td.getMonth(),td.getDate(),12,0,0);
    const t=SunCalc.getTimes(noon,lat,lng);
    const sunrise=t.sunrise,sunset=t.sunset;
    const bm=new Date(+sunrise-96*60*1000);
    return{index:i,name,isActive:i===activeIdx,dayOffset,
      brahmaMuhurtaStart:bm,brahmaMuhurtaEnd:new Date(+bm+48*60*1000),sunrise,sunset};
  });
}

// Special yogas
const SARV=[[0,[0,7,20,21,22,23,26]],[1,[3,6,7,22,23,24,25,26]],[2,[0,3,15,16,17,26]],[3,[3,6,7,15,22,23,24,25,26]],[4,[3,6,7,15,22,23,24,25,26]],[5,[3,6,7,15,22,23,24,25,26]],[6,[7,15,26]]];
const AMRT=[[0,[23]],[1,[3]],[2,[3]],[3,[6]],[4,[6]],[5,[7]],[6,[26]]];
function specialYogas(vaarIdx,nakIdx,vaarStart,vaarEnd){
  // vaarStart/vaarEnd = Brahma Muhurta start to next day BM — the full Vedic day span
  const r=[];
  const t=vaarStart?{start:vaarStart,end:vaarEnd}:{};
  if(vaarIdx===0&&nakIdx===7)r.push({name:'Ravi Pushya Yoga',symbol:'☀️',desc:'Sunday + Pushya — extremely auspicious',...t});
  if(vaarIdx===4&&nakIdx===7)r.push({name:'Guru Pushya Yoga',symbol:'🪔',desc:'Thursday + Pushya — highly auspicious',...t});
  const sc=SARV.find(([d])=>d===vaarIdx);if(sc&&sc[1].includes(nakIdx))r.push({name:'Sarvartha Siddhi Yoga',symbol:'🌺',desc:'Favorable for accomplishing all goals',...t});
  const ac=AMRT.find(([d])=>d===vaarIdx);if(ac&&ac[1].includes(nakIdx))r.push({name:'Amrita Siddhi Yoga',symbol:'🌼',desc:'Very auspicious — removes obstacles',...t});
  return r;
}

function fmt12(d){if(!d||isNaN(+d))return'—';return d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit',hour12:true})}
function fmtDate(d){if(!d||isNaN(+d))return'—';return d.toLocaleDateString('en-IN',{month:'short',day:'numeric'})}
function fmtDT(d){return fmtDate(d)+' '+fmt12(d)}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
function fmtEnd(end,ref){return sameDay(end,ref)?fmt12(end):fmtDate(end)+' '+fmt12(end)}
function dur(s,e){const m=Math.round((+e-+s)/60000);return m<60?m+'m':Math.floor(m/60)+'h '+(m%60?m%60+'m':'')}

function computeAll(){
  const now=new Date();
  const jd=dateToJD(now);
  const vaarStrip=getVaarStrip(now,LAT,LNG);
  const activeVaarIdx=getVedicVaarIdx(now,LAT,LNG);
  const activeVaar=vaarStrip[activeVaarIdx];
  // Compute tithi/nakshatra/yoga for NOW (always today's data)
  const tithiPeriods=getTithiPeriods(jd,10);
  const currentTithiIdx=tithiIdx(jd);
  const nakshatraPeriods=getNakshatraPeriods(jd,3);
  const yogaPeriods=getYogaPeriods(jd,3);
  const karanaPeriods=getKaranaPeriods(jd,5);
  const lunarMonthTithis=getLunarMonthTithis(jd);
  const hm=hinduMonth(jd);
  const am=adhikMaas(jd);
  const ga=gaurabda(now);
  const spVaarEnd=new Date(+activeVaar.sunrise+86400000-96*60*1000);
  const sp=specialYogas(activeVaarIdx,nakshatraPeriods[0]?.index??0,activeVaar.brahmaMuhurtaStart,spVaarEnd);
  return{now,jd,vaarStrip,activeVaarIdx,activeVaar,tithiPeriods,currentTithiIdx,
    nakshatraPeriods,yogaPeriods,karanaPeriods,lunarMonthTithis,hm,am,ga,sp};
}

  }
  function cellWithStatus(label,status,statusCls,name,fx,timeHTML,cls=''){
    return`<div class="now-cell ${cls}">
      <div class="now-cell-top"><div class="now-cell-label">${label}</div><span class="now-cell-status ${statusCls}">${status}</span></div>
      <div class="now-cell-name">${name}</div>
      <div class="now-cell-effect">${fx}</div>
      <div class="now-cell-time">${timeHTML}</div>
    </div>`;
  }

  const nowLabel=isSelected?'At Sunrise':'Now';
  const timeLeftLabel=isSelected?'during sunrise':'left';
  let html='';
  // Tithi
  html+=cell('Tithi '+nowLabel,
    curTithi.name+' <small style="font-size:.6rem;color:var(--muted)">'+curTithi.paksha+'</small>',
    TITHI_FX[curTithi.index],
    `ends ${fmtEnd(jdToDate(curTithi.endJD),now)}<br><span style="color:rgba(107,107,133,.5)">${dur(now,jdToDate(curTithi.endJD))} ${timeLeftLabel}</span>`,'good');
  // Nakshatra
  html+=cell('Nakshatra '+nowLabel,curNak.name,
    NAK_FX[curNak.index],
    `ends ${fmtEnd(jdToDate(curNak.endJD),now)}<br><span style="color:rgba(107,107,133,.5)">${dur(now,jdToDate(curNak.endJD))} ${timeLeftLabel}</span>`,'good');
  // Yoga
  html+=cell('Yoga '+nowLabel,curYoga.name,
    YOGA_FX[curYoga.index],
    `ends ${fmtEnd(jdToDate(curYoga.endJD),now)}<br><span style="color:rgba(107,107,133,.5)">${dur(now,jdToDate(curYoga.endJD))} ${timeLeftLabel}</span>`,'');
  // Karana
  html+=cell('Karana '+nowLabel,curKarana.name,
    'Half-tithi unit — current lunar half',
    `ends ${fmtEnd(jdToDate(curKarana.endJD),now)}<br><span style="color:rgba(107,107,133,.5)">${dur(now,jdToDate(curKarana.endJD))} ${timeLeftLabel}</span>`,'');
  // Active muhurta
  if(activeMuhurta){
    html+=cellWithStatus('Muhurta Active','● Now',
      activeMuhurta.type==='good'?'active':'active',
      activeMuhurta.label,
      MEFF[activeMuhurta.label]||'',
      timeStr(activeMuhurta.s,activeMuhurta.e),
      activeMuhurta.type==='warn'?'warn':'good');
  }
  // Coming soon muhurta
  if(nextMuhurta){
    const minsAway=Math.round((+nextMuhurta.s-+now)/60000);
    const soonLabel=minsAway<60?`in ${minsAway}m`:`in ${Math.floor(minsAway/60)}h ${minsAway%60?minsAway%60+'m':''}`;
    html+=cellWithStatus(isSelected?'First Muhurta of Day':'Coming Soon',isSelected?fmtDate(nextMuhurta.s):soonLabel,'soon',
      nextMuhurta.label,
      MEFF[nextMuhurta.label]||'',
      timeStr(nextMuhurta.s,nextMuhurta.e),
      nextMuhurta.type==='warn'?'warn':'');
  }
  return html;
}

// ═══════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════
function renderAll(){
  if(!DATA)return;
  const{now,jd,vaarStrip,activeVaarIdx,activeVaar,tithiPeriods,currentTithiIdx,
    nakshatraPeriods,yogaPeriods,karanaPeriods,lunarMonthTithis,hm,am,ga,sp}=DATA;

  // Which vaar to DISPLAY (for muhurtas/day bounds)
  const displayVaarIdx=selectedVaarIdx!==null?selectedVaarIdx:activeVaarIdx;
  const displayVaar=vaarStrip[displayVaarIdx];
  const isActive=displayVaarIdx===activeVaarIdx;

  // Muhurta data for the DISPLAYED vaar
  const md=getMuhurtaData(displayVaar,LAT,LNG);

  // Header always shows today's info
  document.getElementById('gaurabda').textContent='Gaurabda '+ga;
  document.getElementById('vaar-name').textContent=activeVaar.name+' Vaar';
  const paksha=currentTithiIdx<15?'Sukla':'Krishna';
  document.getElementById('month-line').innerHTML=
    (am.isAdhik?`<span class="adhik-badge">${am.isPurushottam?'Purushottam':'Adhik'}</span>${am.nextMonthName}`:hm.name)+
    ' &nbsp;·&nbsp; '+paksha+' Paksha';
  document.getElementById('vaishnav-line').textContent='Vaishnav Month of '+hm.vaishnavName;

  // Vaar strip — highlight today and selected separately
  document.getElementById('vaar-strip').innerHTML=vaarStrip.map(v=>{
    let cls='';
    if(v.isActive)cls='today';
    if(selectedVaarIdx!==null&&v.index===selectedVaarIdx)cls='selected';
    const dayLabel=v.dayOffset===0?'Today':v.dayOffset===1?'Tmrw':v.dayOffset===-1?'Yest':
      v.dayOffset>0?'+'+v.dayOffset+'d':v.dayOffset+'d';
    return`<button class="vaar-btn ${cls}" onclick="selectVaar(${v.index})">
      <span class="icon">${VAAR_ICON[v.index]}</span>
      <span class="name">${v.name}</span>
      <span class="name-bn" style="font-size:.5rem;color:var(--muted)">${dayLabel}</span>
    </button>`;
  }).join('');

  // Now panel — uses selected vaar if chosen, else current moment
  let panelRef, panelTithiP, panelNakP, panelYogaP, panelKarP, panelMd, panelLabel;
  if(!isActive){
    // Compute panchanga at the selected vaar's SUNRISE so all data is correct for that day
    const refTime=displayVaar.sunrise;
    const refJD=dateToJD(refTime);
    panelRef=refTime;
    panelTithiP=getTithiPeriods(refJD,6);
    panelNakP=getNakshatraPeriods(refJD,3);
    panelYogaP=getYogaPeriods(refJD,3);
    panelKarP=getKaranaPeriods(refJD,5);
    panelMd=md;
    const off=displayVaar.dayOffset;
    const when=off===1?'Tomorrow':off===-1?'Yesterday':off>0?'+'+off+' days':off+' days';
    panelLabel=displayVaar.name+' Vaar &nbsp;<span style="font-weight:400;opacity:.6">('+when+' &middot; '+fmtDate(displayVaar.sunrise)+')</span>';
  }else{
    panelRef=now;
    panelTithiP=tithiPeriods;
    panelNakP=nakshatraPeriods;
    panelYogaP=yogaPeriods;
    panelKarP=karanaPeriods;
    panelMd=md;
    panelLabel='Right Now &amp; Coming Soon';
  }
  document.getElementById('now-panel-title').innerHTML=panelLabel;
  document.getElementById('now-grid').innerHTML=buildNowPanel(panelRef,panelTithiP,panelNakP,panelYogaP,panelKarP,panelMd,!isActive);

  // Viewing bar
  const vb=document.getElementById('viewing-bar');
  if(!isActive){
    vb.style.display='block';
    const off=displayVaar.dayOffset;
    const when=off===1?'Tomorrow':off===-1?'Yesterday':off>0?'+'+off+' days':off+' days';
    document.getElementById('viewing-label').textContent=`${displayVaar.name} Vaar (${when})`;
  }else{vb.style.display='none';}

  // Lunar month grid
  const sukla=lunarMonthTithis.filter(t=>t.paksha==='Sukla');
  const krishna=lunarMonthTithis.filter(t=>t.paksha==='Krishna');
  document.getElementById('month-grid').innerHTML=
    `<div class="paksha-label s">Sukla Paksha — Waxing Moon</div>`+
    sukla.map((t,i)=>tCell(t,i+1,t.index===currentTithiIdx,'S')).join('')+
    `<div class="paksha-label k">Krishna Paksha — Waning Moon</div>`+
    krishna.map((t,i)=>tCell(t,i+1,t.index===currentTithiIdx,'K')).join('');

  // Day boundaries — from DISPLAYED vaar
  document.getElementById('db-grid').innerHTML=[
    {icon:'🌄',label:'Brahma Muhurta',s:md.brahmaMuhurta.start,e:md.brahmaMuhurta.end},
    {icon:'☀️',label:'Sunrise',s:md.sunrise,e:null},
    {icon:'🌇',label:'SandhyaKal',s:md.sunrise,e:md.sandhyaEnd},
    {icon:'🌆',label:'Sunset',s:md.sunset,e:null},
    {icon:'🌇',label:'Sunset Sandhya',s:md.sunsetSandhyaStart,e:md.sunset},
    {icon:'🌕',label:'Moonrise',s:md.moonrise,e:null},
    {icon:'🌑',label:'Moonset',s:md.moonset,e:null},
    {icon:'🔆',label:'Solar Noon',s:md.noon,e:null},
  ].map(x=>`<div class="db-card">
    <div class="db-label">${x.icon} ${x.label}</div>
    <div class="db-time">${fmtDT(x.s)}${x.e?`<span class="sub"><br>– ${fmtEnd(x.e,x.s)}</span>`:''}</div>
  </div>`).join('');

  // Tithi rows — for the DISPLAYED vaar's vedic day window
  const bmStart=+displayVaar.brahmaMuhurtaStart;
  const nextDayBM=+new Date(+displayVaar.sunrise+86400000-96*60*1000);
  const rel=tithiPeriods.filter(p=>+jdToDate(p.endJD)>bmStart&&+jdToDate(p.startJD)<nextDayBM);
  const nextVaarName=VAAR[(displayVaarIdx+1)%7];
  document.getElementById('tithi-rows').innerHTML=rel.map(p=>{
    const sd=jdToDate(p.startJD),ed=jdToDate(p.endJD);
    const cs=new Date(Math.max(+sd,bmStart)),ce=new Date(Math.min(+ed,nextDayBM));
    const crossPrev=+sd<bmStart,crossNext=+ed>nextDayBM;
    let label;
    if(crossPrev&&crossNext)label='full day';
    else if(crossPrev)label=`upto ${fmtDT(ce)}`;
    else if(crossNext)label=`${fmtDT(cs)}<br>– ${nextVaarName} ${fmtEnd(ce,cs)}`;
    else label=`${fmtDT(cs)}<br>– ${fmtEnd(ce,cs)}`;
    const isK=p.paksha==='Krishna';
    return`<div class="p-row ${isK?'krishna':'sukla'}">
      <div><span class="p-row-name">${p.name}</span><span class="p-row-badge ${isK?'k':'s'}">${p.paksha}</span></div>
      <div class="p-row-time">${label}</div>
    </div>`;
  }).join('');

  // Nakshatra/Yoga/Karana rows — always today's data (panchanga angas don't change by vaar selection)
  document.getElementById('nakshatra-rows').innerHTML=nakshatraPeriods.map(p=>`
    <div class="p-row sukla" style="padding-left:14px">
      <span class="p-row-name">${p.name}</span>
      <div class="p-row-time">${fmtDT(jdToDate(p.startJD))}<br>– ${fmtEnd(jdToDate(p.endJD),jdToDate(p.startJD))}</div>
    </div>`).join('');
  document.getElementById('yoga-rows').innerHTML=yogaPeriods.map(p=>`
    <div class="p-row sukla" style="padding-left:14px">
      <span class="p-row-name">${p.name}</span>
      <div class="p-row-time">${fmtDT(jdToDate(p.startJD))}<br>– ${fmtEnd(jdToDate(p.endJD),jdToDate(p.startJD))}</div>
    </div>`).join('');
  document.getElementById('karana-rows').innerHTML=karanaPeriods.map(p=>`
    <div class="p-row sukla" style="padding-left:14px">
      <span class="p-row-name">${p.name}</span>
      <div class="p-row-time">${fmtDT(jdToDate(p.startJD))}<br>– ${fmtEnd(jdToDate(p.endJD),jdToDate(p.startJD))}</div>
    </div>`).join('');

  // Auspicious/Inauspicious — from DISPLAYED vaar
  function isNowM(s,e){return isActive&&now>=s&&now<e}
  function mRowH(icon,label,s,e,desc,type){
    return`<div class="m-row ${type}${isNowM(s,e)?' now-active':''}">
      <span class="m-icon">${icon}</span>
      <div class="m-body"><div class="m-label">${label}</div><div class="m-desc">${desc}</div></div>
      <div class="m-time">${fmtDate(s)}<br>${fmt12(s)} – ${fmtEnd(e,s)}<br><span style="opacity:.6">${dur(s,e)}</span></div>
    </div>`;
  }
  document.getElementById('ausp-rows').innerHTML=[
    {icon:'🌅',label:'Brahma Muhurta',s:md.brahmaMuhurta.start,e:md.brahmaMuhurta.end,desc:'Best for meditation, study & prayer'},
    {icon:'🏆',label:'Abhijit Muhurta',s:md.abhijit.start,e:md.abhijit.end,desc:'Victory muhurta — excellent for important work'},
    {icon:'⚔️',label:'Vijaya Muhurta',s:md.vijaya.start,e:md.vijaya.end,desc:'Afternoon victory — good for negotiations'},
    {icon:'🌄',label:'Godhuli Muhurta',s:md.godhuli.start,e:md.godhuli.end,desc:'Sacred cow-dust time — around sunset'},
    {icon:'🌙',label:'Nishita Muhurta',s:md.nishita.start,e:md.nishita.end,desc:'Midnight — Tantra, Mantra & deep Sadhana'},
    ...(md.amritaKala?[{icon:'✨',label:'Amrita Kala',s:md.amritaKala.start,e:md.amritaKala.end,desc:'Nakshatra nectar time — abundant results'}]:[]),
  ].map(x=>mRowH(x.icon,x.label,x.s,x.e,x.desc,'auspicious')).join('');

  document.getElementById('inaup-rows').innerHTML=[
    {icon:'☠️',label:'Rahu Kalam',s:md.rahuKalam.start,e:md.rahuKalam.end,desc:'Strictly avoid new beginnings & auspicious work'},
    {icon:'⚰️',label:'Yamaganda',s:md.yamaganda.start,e:md.yamaganda.end,desc:'Yama\'s period — avoid travel & decisions'},
    {icon:'🐍',label:'Gulika (Mandi)',s:md.gulika.start,e:md.gulika.end,desc:'Saturn-influenced — delays & obstacles'},
    ...(md.varjyam?[{icon:'🚫',label:'Varjyam / Tyajya',s:md.varjyam.start,e:md.varjyam.end,desc:'Moon-based window — avoid sacred activities'}]:[]),
    ...md.durMuhurtas.map((d,i)=>({icon:'⚠️',label:`Dur Muhurta ${i+1}`,s:d.start,e:d.end,desc:'Daily inauspicious slot — avoid new ventures'})),
  ].map(x=>mRowH(x.icon,x.label,x.s,x.e,x.desc,'inauspicious')).join('');

  // Special yogas — recompute for displayVaar (may differ from activeVaar)
  let spDisplay=sp;
  if(!isActive){
    const dispNakIdx=Math.floor(moonLong(dateToJD(displayVaar.sunrise))/(360/27))%27;
    const dispVaarEnd=new Date(+displayVaar.sunrise+86400000-96*60*1000);
    spDisplay=specialYogas(displayVaar.index,dispNakIdx,displayVaar.brahmaMuhurtaStart,dispVaarEnd);
  }
  const sec=document.getElementById('special-yoga-sec');
  if(spDisplay.length){
    sec.style.display='block';
    document.getElementById('yoga-cards').innerHTML=spDisplay.map(y=>`
      <div class="yoga-card">
        <div class="yoga-icon">${y.symbol}</div>
        <div>
          <div class="yoga-name">${y.name}</div>
          <div class="yoga-desc">${y.desc}</div>
          ${y.start?`<div class="yoga-time">${fmtDate(y.start)} ${fmt12(y.start)} – ${fmtEnd(y.end,y.start)}</div>`:''}
        </div>
      </div>`).join('');
  }else{sec.style.display='none';}
}

function tCell(t,num,isActive,prefix){
  const sd=jdToDate(t.startJD),ed=jdToDate(t.endJD);
  return`<div class="tcell${isActive?' active':''}">
    <div class="tcell-top">
      <span class="tcell-num">${prefix}${num}</span>
      ${isActive?'<span class="now-badge">Now</span>':''}
    </div>
    <div class="tcell-name">${t.name}</div>
    <div class="tcell-start">${fmtDate(sd)} ${fmt12(sd)}</div>
    <div class="tcell-end">→ ${fmtEnd(ed,sd)}</div>
  </div>`;
}

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
function init(){
  DATA=computeAll();
  document.getElementById('loading').style.display='none';
  document.getElementById('main').style.display='block';
  renderAll();
}
setInterval(()=>{DATA=computeAll();renderAll();},30000);
setTimeout(init,400);
</script>

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('SW registered, scope:', reg.scope))
      .catch(err => console.warn('SW registration failed:', err));
  });
}
