<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pañcāṅga · Hindu Almanac</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet"/>
<style>
:root {
  --ink:#0e0a06; --parchment:#f5edd8; --gold:#c8902a; --gold-light:#e8b84b;
  --saffron:#e07b1a; --deep:#1a0f00; --muted:#8a7458; --pill-bg:rgba(200,144,42,0.15);
  --card:#1e1408; --border:rgba(200,144,42,0.18);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--deep);
  font-family:'Cormorant Garamond',serif;
  color:var(--parchment);
  min-height:100vh;
  overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse at 15% 20%,rgba(200,144,42,0.07) 0%,transparent 55%),
    radial-gradient(ellipse at 85% 75%,rgba(26,58,92,0.25) 0%,transparent 55%);
}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.star-dot{
  position:absolute;background:#e8d5a3;border-radius:50%;
  animation:twinkle var(--dur,3s) ease-in-out infinite var(--delay,0s)
}
@keyframes twinkle{0%,100%{opacity:var(--a1,.3);transform:scale(1)}50%{opacity:var(--a2,.8);transform:scale(1.3)}}

/* ── HEADER ── */
header{
  position:relative;z-index:10;
  background:linear-gradient(180deg,rgba(26,10,0,0.95),rgba(20,12,0,0.9));
  border-bottom:1px solid var(--border);
  padding:1.4rem 1.2rem 1rem;
  display:flex;flex-direction:column;align-items:center;gap:.2rem;
}
.hdr-top{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:820px}
.hdr-om{font-size:1.6rem;color:var(--gold);opacity:.7}
header h1{
  font-family:'Cinzel Decorative',serif;
  font-size:clamp(1.2rem,3.5vw,2rem);
  color:var(--gold-light);
  letter-spacing:.1em;
  text-shadow:0 0 30px rgba(200,144,42,0.45);
  text-align:center;flex:1;
}
.hdr-sub{font-style:italic;color:var(--muted);font-size:.85rem;letter-spacing:.06em;text-align:center}

/* ── CONTROLS CARD ── */
.controls{
  position:relative;z-index:10;
  max-width:820px;margin:1rem auto;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:10px;
  padding:1rem 1.2rem;
  display:flex;flex-wrap:wrap;gap:.8rem;align-items:flex-end;
  box-shadow:0 4px 24px rgba(0,0,0,0.4);
}
.ctrl-group{display:flex;flex-direction:column;gap:.25rem;min-width:0}
.ctrl-group label{
  font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)
}
input[type="date"],input[type="time"],input[type="number"],select{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(200,144,42,0.28);
  border-radius:5px;color:var(--parchment);
  padding:.38rem .65rem;
  font-family:'JetBrains Mono',monospace;font-size:.82rem;
  outline:none;transition:border-color .2s;
  width:100%;
}
input:focus,select:focus{border-color:var(--gold)}
select option{background:#1a0f00}
.ctrl-row{display:flex;gap:.8rem;align-items:flex-end;flex-wrap:wrap;flex:1}

/* GPS Button */
.btn-gps{
  display:flex;align-items:center;gap:.4rem;
  background:rgba(26,58,92,0.5);
  border:1px solid rgba(100,160,220,0.35);
  border-radius:5px;color:#a0c4e8;
  padding:.42rem .9rem;font-size:.78rem;letter-spacing:.07em;
  cursor:pointer;transition:all .2s;white-space:nowrap;
  font-family:'Cormorant Garamond',serif;
  height:fit-content;
}
.btn-gps:hover{background:rgba(26,58,92,0.8);border-color:rgba(100,160,220,0.6)}
.btn-gps svg{width:14px;height:14px;flex-shrink:0}
.btn-gps.locating{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Calc Button */
.btn-calc{
  background:linear-gradient(135deg,var(--saffron),var(--gold));
  border:none;border-radius:5px;
  color:var(--deep);font-family:'Cinzel Decorative',serif;
  font-size:.75rem;font-weight:700;
  padding:.48rem 1.3rem;cursor:pointer;
  letter-spacing:.08em;
  box-shadow:0 2px 14px rgba(200,144,42,0.3);
  transition:box-shadow .2s,transform .1s;
  white-space:nowrap;height:fit-content;
}
.btn-calc:hover{box-shadow:0 4px 22px rgba(200,144,42,0.55);transform:translateY(-1px)}
.btn-calc:active{transform:translateY(0)}
.btn-calc:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* GPS status strip */
.gps-status{
  width:100%;font-size:.75rem;color:#7ab0d4;
  font-style:italic;padding-top:.1rem;display:none;
  letter-spacing:.04em;
}
.gps-status.visible{display:block}
.gps-status.error{color:#e07b7b}

/* ── DATE BANNER ── */
.date-banner{
  position:relative;z-index:10;
  max-width:820px;margin:0 auto .6rem;
  background:linear-gradient(135deg,rgba(200,144,42,0.12),rgba(200,144,42,0.05));
  border:1px solid var(--border);border-radius:8px;
  padding:.7rem 1.2rem;
  display:none;
}
.date-banner.visible{display:block}
.date-main{
  font-family:'Cinzel Decorative',serif;
  font-size:clamp(.9rem,2.5vw,1.2rem);
  color:var(--gold-light);letter-spacing:.06em;
}
.date-hindu{
  font-size:.82rem;color:var(--muted);font-style:italic;margin-top:.15rem
}
.date-hindu strong{color:var(--saffron)}

/* ── MAIN GRID ── */
.main{
  position:relative;z-index:10;
  max-width:820px;margin:0 auto 1.5rem;
  display:grid;grid-template-columns:1fr 1fr;
  gap:.8rem;padding:0 0 .5rem;
}
@media(max-width:600px){.main{grid-template-columns:1fr}}

/* ── PANEL ── */
.panel{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 4px 20px rgba(0,0,0,0.35);
}
.panel-head{
  display:flex;align-items:center;gap:.5rem;
  padding:.65rem 1rem;
  border-bottom:1px solid var(--border);
  background:rgba(200,144,42,0.06);
}
.panel-head-icon{font-size:1rem}
.panel-head-title{
  font-family:'Cinzel Decorative',serif;
  font-size:.72rem;letter-spacing:.16em;
  color:var(--gold);text-transform:uppercase;
}
.panel-body{padding:.6rem .9rem .9rem}

/* ── PANCHANG ROWS ── */
.p-row{
  display:grid;grid-template-columns:100px 1fr;
  padding:.5rem 0;
  border-bottom:1px solid rgba(200,144,42,0.07);
  animation:fadeUp .35s ease both;
}
.p-row:last-child{border-bottom:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.p-row:nth-child(1){animation-delay:.04s}.p-row:nth-child(2){animation-delay:.08s}
.p-row:nth-child(3){animation-delay:.12s}.p-row:nth-child(4){animation-delay:.16s}
.p-row:nth-child(5){animation-delay:.20s}.p-row:nth-child(6){animation-delay:.24s}
.p-row:nth-child(7){animation-delay:.28s}.p-row:nth-child(8){animation-delay:.32s}
.p-lbl{
  font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);padding-top:.1rem;line-height:1.4;
}
.p-val{font-size:.98rem;color:var(--parchment);line-height:1.45}
.p-val strong{color:var(--gold-light);font-weight:600}
.p-sub{display:block;font-size:.75rem;color:var(--muted);font-style:italic;margin-top:.05rem}
.pill{
  display:inline-block;background:var(--pill-bg);
  border:1px solid rgba(200,144,42,0.28);border-radius:20px;
  padding:.06rem .5rem;font-size:.7rem;color:var(--gold-light);
  letter-spacing:.05em;margin-left:.3rem;vertical-align:middle;
}
.adhik{
  display:inline-block;background:rgba(224,123,26,0.18);
  border:1px solid var(--saffron);border-radius:3px;
  padding:.04rem .4rem;font-size:.68rem;color:var(--saffron);
  letter-spacing:.07em;margin-left:.4rem;vertical-align:middle;
}
.tithi-bar{
  margin-top:.3rem;
  background:rgba(255,255,255,0.03);
  border-left:2px solid var(--gold);
  border-radius:2px;padding:.25rem .5rem;
  font-size:.75rem;color:var(--muted);
  font-family:'JetBrains Mono',monospace;
}
.tithi-bar span{color:var(--parchment)}

/* ── SKY TABLE (Earth-sky vs Celestial) ── */
/* Matches ISKCON Panjika layout exactly */
.sky-table{width:100%;border-collapse:collapse;font-size:.88rem}
.sky-table thead tr th{
  font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);padding:.35rem .4rem;
  border-bottom:1px solid var(--border);text-align:right;
}
.sky-table thead tr th:first-child{text-align:left}
.sky-table tbody tr{
  border-bottom:1px solid rgba(200,144,42,0.06);
  animation:fadeUp .4s ease both;
}
.sky-table tbody tr:last-child{border-bottom:none}
.sky-table tbody tr:nth-child(1){animation-delay:.05s}
.sky-table tbody tr:nth-child(2){animation-delay:.10s}
.sky-table tbody tr:nth-child(3){animation-delay:.15s}
.sky-table tbody tr:nth-child(4){animation-delay:.20s}
.sky-table tbody tr:nth-child(5){animation-delay:.25s}
.sky-table tbody tr:nth-child(6){animation-delay:.30s}
.sky-table tbody tr:nth-child(7){animation-delay:.35s}
.sky-table tbody tr:nth-child(8){animation-delay:.40s}
.sky-table td{padding:.42rem .4rem;vertical-align:middle}
.sky-table td:first-child{color:var(--muted);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase}
.sky-table td.earth-time{
  text-align:right;font-family:'JetBrains Mono',monospace;
  color:var(--parchment);font-weight:400;font-size:.92rem;
}
.sky-table td.cel-time{
  text-align:right;font-family:'JetBrains Mono',monospace;
  color:var(--muted);font-size:.82rem;
}
.sky-icon{margin-right:.3rem;font-size:.9rem}
tr.highlight-row td{background:rgba(200,144,42,0.07)}
tr.divider-row td{padding:0;height:1px;background:linear-gradient(to right,transparent,rgba(200,144,42,0.2),transparent)}

/* ── PLACEHOLDER ── */
.placeholder{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:2.5rem 1rem;gap:.7rem;opacity:.3;
}
.placeholder .g{font-size:2.8rem}
.placeholder p{font-style:italic;font-size:.85rem;text-align:center}

/* ── ERROR ── */
.err{
  color:#e07b7b;font-style:italic;padding:.8rem;font-size:.85rem;
  background:rgba(224,123,123,0.07);border:1px solid rgba(224,123,123,0.18);
  border-radius:6px;margin:.5rem 0;
}

/* ── FOOTER ── */
footer{
  position:relative;z-index:10;text-align:center;
  padding:.8rem 1rem;color:var(--muted);font-size:.72rem;
  letter-spacing:.08em;border-top:1px solid rgba(200,144,42,0.1);
}
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<!-- HEADER -->
<header>
  <div class="hdr-top">
    <div class="hdr-om">ॐ</div>
    <h1>Pañcāṅga</h1>
    <div style="width:2rem"></div>
  </div>
  <div class="hdr-sub">Traditional Hindu Almanac · Swiss Ephemeris · Pure WASM</div>
</header>

<!-- CONTROLS -->
<div class="controls" style="margin-left:auto;margin-right:auto;padding-left:1rem;padding-right:1rem">
  <div class="ctrl-row">
    <div class="ctrl-group">
      <label>Date</label>
      <input type="date" id="inDate"/>
    </div>
    <div class="ctrl-group">
      <label>Time</label>
      <input type="time" id="inTime" value="06:00"/>
    </div>
    <div class="ctrl-group" style="min-width:80px">
      <label>Latitude</label>
      <input type="number" id="inLat" placeholder="28.6139" step="0.0001" value="28.6139"/>
    </div>
    <div class="ctrl-group" style="min-width:80px">
      <label>Longitude</label>
      <input type="number" id="inLon" placeholder="77.2090" step="0.0001" value="77.2090"/>
    </div>
    <div class="ctrl-group" style="min-width:65px">
      <label>TZ (hrs)</label>
      <input type="number" id="inTZ" value="5.5" step="0.5" min="-12" max="14"/>
    </div>
  </div>
  <div style="display:flex;gap:.6rem;align-items:center;flex-wrap:wrap">
    <button class="btn-gps" id="btnGPS" onclick="getGPS()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
        <circle cx="12" cy="12" r="8" stroke-opacity=".4"/>
      </svg>
      GPS
    </button>
    <button class="btn-calc" id="btnCalc" onclick="calculate()">Calculate</button>
  </div>
  <div class="gps-status" id="gpsStatus"></div>
</div>

<!-- DATE BANNER -->
<div class="date-banner" id="dateBanner" style="padding-left:1rem;padding-right:1rem">
  <div class="date-main" id="bannerMain"></div>
  <div class="date-hindu" id="bannerHindu"></div>
</div>

<!-- MAIN PANELS -->
<div class="main" style="padding-left:1rem;padding-right:1rem">
  <!-- Left: Panchang -->
  <div class="panel">
    <div class="panel-head">
      <span class="panel-head-icon">🌍</span>
      <span class="panel-head-title">Pañcāṅga</span>
    </div>
    <div class="panel-body" id="earthContent">
      <div class="placeholder"><div class="g">🪔</div><p>Enter date &amp; location,<br>then calculate.</p></div>
    </div>
  </div>

  <!-- Right: Sky Times -->
  <div class="panel">
    <div class="panel-head">
      <span class="panel-head-icon">🌌</span>
      <span class="panel-head-title">Sky Times</span>
    </div>
    <div class="panel-body" id="skyContent">
      <div class="placeholder"><div class="g">🌅</div><p>Solar times<br>will appear here.</p></div>
    </div>
  </div>
</div>

<footer>Swiss Ephemeris WASM · SEFLG_SWIEPH · ~1 arcsec · No Moshier fallback</footer>

<!-- Swiss Ephemeris WASM -->
<script src="https://cdn.jsdelivr.net/npm/swisseph-wasm@1.0.4/dist/swisseph.js"></script>
<script>
// ══════════════════════════════════════════════
//  STARS
// ══════════════════════════════════════════════
(function(){
  const c=document.getElementById('stars');
  for(let i=0;i<100;i++){
    const d=document.createElement('div');d.className='star-dot';
    const s=Math.random()*2+.5;
    Object.assign(d.style,{
      width:s+'px',height:s+'px',
      left:Math.random()*100+'%',top:Math.random()*100+'%',
      '--dur':(Math.random()*4+2).toFixed(1)+'s',
      '--delay':(Math.random()*5).toFixed(2)+'s',
      '--a1':(Math.random()*.25+.08).toFixed(2),
      '--a2':(Math.random()*.5+.35).toFixed(2),
    });
    c.appendChild(d);
  }
})();

// ══════════════════════════════════════════════
//  SE BRIDGE — pure SEFLG_SWIEPH, no fallback
// ══════════════════════════════════════════════
const SE={
  _se:null,_ready:false,_p:null,
  init(){
    if(this._p)return this._p;
    this._p=new Promise((res,rej)=>{
      if(typeof SwissEph==='undefined'){rej(new Error('SwissEph WASM not loaded'));return}
      SwissEph().then(se=>{
        this._se=se;
        this._se.swe_set_ephe_path('');
        this._ready=true;
        console.log('[SE] ready');res();
      }).catch(rej);
    });
    return this._p;
  },
  _F: 2|256, // SEFLG_SWIEPH | SEFLG_SPEED
  _jd(d){return d.getTime()/86400000+2440587.5},
  _lon(jd,b){
    if(!this._ready)throw new Error('SE not ready');
    const r=this._se.swe_calc_ut(jd,b,this._F);
    if(r.flag<0)throw new Error('swe_calc_ut: '+(r.error||'err'));
    return((r.longitude%360)+360)%360;
  },
  moonElong(d){const j=this._jd(d);return(((this._lon(j,1)-this._lon(j,0))%360)+360)%360},
  moonLon(d){return this._lon(this._jd(d),1)},
  sunLon(d){return this._lon(this._jd(d),0)},
};

// ══════════════════════════════════════════════
//  CONSTANTS
// ══════════════════════════════════════════════
const TITHIS=['Pratipadā','Dvitīyā','Tṛtīyā','Chaturthī','Pañchamī',
  'Ṣaṣṭhī','Saptamī','Aṣṭamī','Navamī','Daśamī',
  'Ekādaśī','Dvādaśī','Trayodaśī','Chaturdaśī','Pūrṇimā'];
const NAKSHATRA=['Aśvinī','Bharaṇī','Kṛttikā','Rohiṇī','Mṛgaśīrṣā','Ārdrā','Punarvasu',
  'Puṣya','Āśleṣā','Maghā','Pūrva Phalgunī','Uttara Phalgunī','Hasta','Chitrā',
  'Svātī','Viśākhā','Anurādhā','Jyeṣṭhā','Mūla','Pūrvāṣāḍhā','Uttarāṣāḍhā',
  'Śravaṇa','Dhaniṣṭhā','Śatabhiṣā','Pūrva Bhādrapadā','Uttara Bhādrapadā','Revatī'];
const YOGA=['Viṣkambha','Prīti','Āyuṣmān','Saubhāgya','Śobhana','Atigaṇḍa','Sukarman',
  'Dhṛti','Śūla','Gaṇḍa','Vṛddhi','Dhruva','Vyāghāta','Harṣaṇa','Vajra',
  'Siddhi','Vyatīpāta','Varīyān','Parigha','Śiva','Siddha','Sādhya','Śubha',
  'Śukla','Brahma','Indra','Vaidhṛti'];
const KARANA=['Kiṃstughna','Bava','Bālava','Kaulava','Taitila','Gara','Vaṇija','Viṣṭi'];
const FIXED_KAR=['Śakuni','Catuṣpāda','Nāga','Kiṃstughna'];
const VAARA=['Ravivāra','Somavāra','Maṅgalavāra','Budhavāra','Guruvāra','Śukravāra','Śanivāra'];
const VAARA_EN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const PAKSHA=['Śukla','Kṛṣṇa'];
const SOLAR_MONTHS=['Chaitra','Vaiśākha','Jyeṣṭha','Āṣāḍha','Śrāvaṇa','Bhādrapada',
  'Āśvina','Kārtika','Mārgaśīrṣa','Pauṣa','Māgha','Phālguna'];
// Purnimanta lunar months (month name based on full moon nakshatra region)
const LUNAR_MONTHS=['Chaitra','Vaiśākha','Jyeṣṭha','Āṣāḍha','Śrāvaṇa','Bhādrapada',
  'Āśvina','Kārtika','Mārgaśīrṣa','Pauṣa','Māgha','Phālguna'];

// ══════════════════════════════════════════════
//  PANCHANG ENGINE
// ══════════════════════════════════════════════
function calcPanchang(localDate,tzH){
  const utc=new Date(localDate.getTime()-tzH*3600000);
  const elong=SE.moonElong(utc);
  const moonLon=SE.moonLon(utc);
  const sunLon=SE.sunLon(utc);

  // Tithi
  const tIdx=Math.floor(elong/12);     // 0–29
  const paksha=tIdx<15?0:1;
  const tWithin=tIdx%15;               // 0–14
  let tithiName=TITHIS[tWithin];
  if(tIdx===29)tithiName='Amāvasyā';
  else if(tIdx===14)tithiName='Pūrṇimā';

  // Tithi end (binary search forward)
  const nextBound=(Math.floor(elong/12)+1)*12;
  const tEndUTC=findElongCross(utc,nextBound);
  const tStartBound=Math.floor(elong/12)*12;
  const tStartUTC=findElongCrossBack(utc,tStartBound);

  // Nakshatra
  const nakIdx=Math.floor(moonLon/(360/27));

  // Yoga
  const yogaDeg=((sunLon+moonLon)%360+360)%360;
  const yogaIdx=Math.floor(yogaDeg/(360/27));

  // Karana
  const karanaIdx=getKarana(elong);

  // Vaara
  const dow=localDate.getDay();

  // Hindu Solar Month
  const {month,adhik,lunarMonth}=getHinduMonth(utc,sunLon);

  // Tithi end note for display (e.g. "up to 20:41")
  const tEndLocal=tEndUTC?new Date(tEndUTC.getTime()+tzH*3600000):null;
  const tStartLocal=tStartUTC?new Date(tStartUTC.getTime()+tzH*3600000):null;

  return{
    tithiName,tWithin,paksha,
    pakshaName:PAKSHA[paksha]+' Pakṣa',
    nakshatra:NAKSHATRA[nakIdx],
    yoga:YOGA[yogaIdx],
    karana:karanaIdx,
    vaara:VAARA[dow],vaaraEn:VAARA_EN[dow],
    month,lunarMonth,adhik,
    tEndLocal,tStartLocal,
  };
}

function findElongCross(fromUTC,target){
  const step=10*60000;
  let prev=SE.moonElong(fromUTC);
  for(let t=fromUTC.getTime()+step;t<=fromUTC.getTime()+35*86400000;t+=step){
    const cur=SE.moonElong(new Date(t));
    const cu=cur<prev-300?cur+360:cur;
    if(cu>=target&&prev<target){
      let lo=t-step,hi=t;
      for(let i=0;i<28;i++){
        const mid=(lo+hi)/2;
        const e=SE.moonElong(new Date(mid));
        const eu=e<6&&target>354?e+360:e;
        if(eu<target)lo=mid;else hi=mid;
      }
      return new Date((lo+hi)/2);
    }
    prev=cur;
  }
  return null;
}

function findElongCrossBack(fromUTC,target){
  // Search backwards up to 2 days
  const step=10*60000;
  for(let t=fromUTC.getTime();t>=fromUTC.getTime()-2*86400000;t-=step){
    const e1=SE.moonElong(new Date(t-step));
    const e2=SE.moonElong(new Date(t));
    const e1u=e1<e2-300?e1+360:e1;
    if(e1u<target&&e2>=target){
      let lo=t-step,hi=t;
      for(let i=0;i<24;i++){
        const mid=(lo+hi)/2;
        const e=SE.moonElong(new Date(mid));
        const eu=e<6&&target>354?e+360:e;
        if(eu<target)lo=mid;else hi=mid;
      }
      return new Date((lo+hi)/2);
    }
  }
  return null;
}

function getKarana(elong){
  const half=Math.floor(elong/6);// 0–59
  if(half===0)return{name:'Kiṃstughna',fixed:true};
  if(half>=57)return{name:FIXED_KAR[half-57+1]||'Nāga',fixed:true};
  const idx=((half-1)%7)+1;
  return{name:KARANA[idx],fixed:false};
}

function getHinduMonth(utcDate,sunLon){
  // Solar month from Sun rashi
  const rashiIdx=Math.floor(sunLon/30);
  const month=SOLAR_MONTHS[rashiIdx];
  // Lunar month (Purnimanta): approximate from moon phase
  // The lunar month is named by which rashi the full moon falls in
  const moonLon=SE.moonLon(utcDate);
  const lunarMonth=LUNAR_MONTHS[Math.floor(moonLon/30)%12];
  // Adhik Maas: sun stays in same rashi for >30 days means an extra lunar month
  const sun30=SE.sunLon(new Date(utcDate.getTime()+30*86400000));
  const rashi30=Math.floor(sun30/30);
  const adhik=rashiIdx===rashi30;
  return{month,lunarMonth,adhik};
}

// ══════════════════════════════════════════════
//  SOLAR TIMES
//  Earth-sky = apparent (horizon corrected)
//  Celestial = mean (no refraction, exact 0°)
// ══════════════════════════════════════════════
function calcSolarTimes(localDate,lat,lon,tzH){
  const dayUTC=new Date(localDate.getTime()-tzH*3600000);
  dayUTC.setUTCHours(0,0,0,0);

  const sunriseApp=findSolarEvent(dayUTC,lat,lon,'rise',-0.833);  // apparent
  const sunsetApp =findSolarEvent(dayUTC,lat,lon,'set', -0.833);
  const sunriseCel=findSolarEvent(dayUTC,lat,lon,'rise', 0.0);    // celestial
  const sunsetCel =findSolarEvent(dayUTC,lat,lon,'set',  0.0);

  const toL=d=>d?new Date(d.getTime()+tzH*3600000):null;
  const srA=toL(sunriseApp),ssA=toL(sunsetApp);
  const srC=toL(sunriseCel),ssC=toL(sunsetCel);

  // Brahma Muhurta = 2 muhurtas (48 min) before apparent sunrise; starts 96 min before
  const braStart=srA?new Date(srA.getTime()-96*60000):null;
  const braEnd  =srA?new Date(srA.getTime()-48*60000):null;
  // Celestial Brahma Muhurta based on celestial sunrise
  const braCStart=srC?new Date(srC.getTime()-96*60000):null;
  const braCEnd  =srC?new Date(srC.getTime()-48*60000):null;

  // Sandhya: 24 min before → 24 min after sunrise/sunset
  const sandMornStart=srA?new Date(srA.getTime()-24*60000):null;
  const sandMornEnd  =srA?new Date(srA.getTime()+24*60000):null;
  const sandEveStart =ssA?new Date(ssA.getTime()-24*60000):null;
  const sandEveEnd   =ssA?new Date(ssA.getTime()+24*60000):null;

  // Noon
  const noon=srA&&ssA?new Date((srA.getTime()+ssA.getTime())/2):null;
  const noonC=srC&&ssC?new Date((srC.getTime()+ssC.getTime())/2):null;

  return{braStart,braEnd,braCStart,braCEnd,
    srA,ssA,srC,ssC,noon,noonC,
    sandMornStart,sandMornEnd,sandEveStart,sandEveEnd};
}

function findSolarEvent(dayStartUTC,lat,lon,type,altTarget){
  const step=5*60000;
  let prev=sunAlt(new Date(dayStartUTC.getTime()),lat,lon);
  for(let t=dayStartUTC.getTime()+step;t<dayStartUTC.getTime()+86400000;t+=step){
    const cur=sunAlt(new Date(t),lat,lon);
    const rising=prev<altTarget&&cur>=altTarget;
    const setting=prev>altTarget&&cur<=altTarget;
    if((type==='rise'&&rising)||(type==='set'&&setting)){
      let lo=t-step,hi=t;
      for(let i=0;i<22;i++){
        const mid=(lo+hi)/2;
        const a=sunAlt(new Date(mid),lat,lon);
        if(type==='rise'?(a<altTarget):(a>altTarget))lo=mid;else hi=mid;
      }
      return new Date((lo+hi)/2);
    }
    prev=cur;
  }
  return null;
}

function sunAlt(utcDate,lat,lon){
  const jd=utcDate.getTime()/86400000+2440587.5;
  const sl=SE.sunLon(utcDate)*Math.PI/180;
  const eps=23.4397*Math.PI/180;
  const ra=Math.atan2(Math.sin(sl)*Math.cos(eps),Math.cos(sl));
  const dec=Math.asin(Math.sin(eps)*Math.sin(sl));
  const gmst=((18.697374558+24.06570982441908*(jd-2451545.0))*15%360+360)%360;
  const lst=((gmst+lon)%360+360)%360;
  const ha=(lst-ra*180/Math.PI)*Math.PI/180;
  const latR=lat*Math.PI/180;
  return Math.asin(Math.sin(latR)*Math.sin(dec)+Math.cos(latR)*Math.cos(dec)*Math.cos(ha))*180/Math.PI;
}

// ══════════════════════════════════════════════
//  FORMAT
// ══════════════════════════════════════════════
function fmt(d){
  if(!d)return'—';
  return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
}

// ══════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════
function renderEarth(p,localDate){
  const ds=localDate.toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'});
  const dow=localDate.toLocaleDateString('en-IN',{weekday:'long'});
  const adhik=p.adhik?`<span class="adhik">Adhika</span>`:'';
  const tEnd=p.tEndLocal?`<span>${fmt(p.tEndLocal)}</span>`:'<span>—</span>';
  const tStart=p.tStartLocal?`<span>${fmt(p.tStartLocal)}</span>`:'<span>—</span>';

  document.getElementById('earthContent').innerHTML=`<div>
    <div class="p-row"><div class="p-lbl">Month</div>
      <div class="p-val"><strong>${p.month}</strong>${adhik}
        <span class="p-sub">${p.lunarMonth} (Pūrṇimānta)</span></div></div>
    <div class="p-row"><div class="p-lbl">Date</div>
      <div class="p-val"><strong>${ds}</strong><span class="p-sub">${dow}</span></div></div>
    <div class="p-row"><div class="p-lbl">Pakṣa</div>
      <div class="p-val"><strong>${p.pakshaName}</strong>
        <span class="p-sub">${p.paksha===0?'Waxing · Bright Fortnight':'Waning · Dark Fortnight'}</span></div></div>
    <div class="p-row"><div class="p-lbl">Tithi</div>
      <div class="p-val"><strong>${p.tithiName}</strong><span class="pill">${p.tWithin+1}/15</span>
        <div class="tithi-bar">From ${tStart} → Until ${tEnd}</div></div></div>
    <div class="p-row"><div class="p-lbl">Nakṣatra</div>
      <div class="p-val"><strong>${p.nakshatra}</strong></div></div>
    <div class="p-row"><div class="p-lbl">Yoga</div>
      <div class="p-val"><strong>${p.yoga}</strong></div></div>
    <div class="p-row"><div class="p-lbl">Karaṇa</div>
      <div class="p-val"><strong>${p.karana.name}</strong>
        ${p.karana.fixed?'<span class="pill">Fixed</span>':''}</div></div>
    <div class="p-row"><div class="p-lbl">Vāra</div>
      <div class="p-val"><strong>${p.vaara}</strong>
        <span class="p-sub">${p.vaaraEn}</span></div></div>
  </div>`;
}

function renderBanner(p,localDate){
  const banner=document.getElementById('dateBanner');
  const main=document.getElementById('bannerMain');
  const hindu=document.getElementById('bannerHindu');
  const ds=localDate.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  main.textContent=ds;
  const adhikStr=p.adhik?` · Adhika Māsa`:'';
  hindu.innerHTML=`<strong>${p.month}${adhikStr}</strong> · ${p.pakshaName} · ${p.tithiName}`;
  banner.classList.add('visible');
}

// ══════════════════════════════════════════════
//  GPS
// ══════════════════════════════════════════════
function getGPS(){
  const btn=document.getElementById('btnGPS');
  const status=document.getElementById('gpsStatus');
  if(!navigator.geolocation){
    status.textContent='⚠ Geolocation not supported by this browser.';
    status.className='gps-status visible error';return;
  }
  btn.classList.add('locating');
  btn.querySelector('svg').style.animation='pulse 0.8s ease-in-out infinite';
  status.textContent='Locating…';status.className='gps-status visible';

  navigator.geolocation.getCurrentPosition(
    pos=>{
      const lat=pos.coords.latitude;
      const lon=pos.coords.longitude;
      document.getElementById('inLat').value=lat.toFixed(4);
      document.getElementById('inLon').value=lon.toFixed(4);
      // Auto-detect TZ offset from browser
      const tzH=-(new Date().getTimezoneOffset())/60;
      document.getElementById('inTZ').value=tzH;
      btn.classList.remove('locating');
      status.textContent=`✓ Located: ${lat.toFixed(4)}°, ${lon.toFixed(4)}° · TZ UTC${tzH>=0?'+':''}${tzH}`;
      status.className='gps-status visible';
    },
    err=>{
      btn.classList.remove('locating');
      let msg='GPS error.';
      if(err.code===1)msg='Location permission denied.';
      else if(err.code===2)msg='Position unavailable.';
      else if(err.code===3)msg='Location request timed out.';
      status.textContent='⚠ '+msg;status.className='gps-status visible error';
    },
    {enableHighAccuracy:true,timeout:10000,maximumAge:60000}
  );
}

// ══════════════════════════════════════════════
//  CALCULATE
// ══════════════════════════════════════════════
async function calculate(){
  const btn=document.getElementById('btnCalc');
  btn.textContent='Calculating…';btn.disabled=true;
  try{
    await SE.init();
    const dateStr=document.getElementById('inDate').value;
    const timeStr=document.getElementById('inTime').value||'06:00';
    const lat=parseFloat(document.getElementById('inLat').value);
    const lon=parseFloat(document.getElementById('inLon').value);
    const tzH=parseFloat(document.getElementById('inTZ').value);
    if(!dateStr)throw new Error('Please select a date.');
    const[yr,mo,dy]=dateStr.split('-').map(Number);
    const[hr,mi]=timeStr.split(':').map(Number);
    const localDate=new Date(yr,mo-1,dy,hr,mi,0,0);
    const panchang=calcPanchang(localDate,tzH);
    const solar=calcSolarTimes(localDate,lat,lon,tzH);
    renderBanner(panchang,localDate);
    renderEarth(panchang,localDate);
    renderSky(solar);
  }catch(e){
    const errHtml=`<div class="err">⚠ ${e.message}</div>`;
    document.getElementById('earthContent').innerHTML=errHtml;
    document.getElementById('skyContent').innerHTML=errHtml;
    console.error(e);
  }
  btn.textContent='Calculate';btn.disabled=false;
}

// Set today on load
window.addEventListener('load',()=>{
  const t=new Date();
  document.getElementById('inDate').value=t.toISOString().split('T')[0];
  document.getElementById('inTime').value=
    t.getHours().toString().padStart(2,'0')+':'+t.getMinutes().toString().padStart(2,'0');
});
</script>
